/* ---- ปรับ DOCX หลังสร้าง (ส่วนที่ไลบรารี docx@8 ทำไม่ได้/ทำไม่ครบ) ----
   1) fontTable.xml ต้องมี relationship จาก document.xml (docx@8 ไม่ใส่ → Word/LibreOffice มองไม่เห็นฟอนต์ที่ฝัง = สาเหตุหน้าเพิ่ม/ไทยเพี้ยนบนเครื่องที่ไม่มีฟอนต์)
   2) ฝังฟอนต์ TH Sarabun New (odttf)   3) PAGEREF ให้เป็นฟิลด์สมบูรณ์   4) ย่อหน้าที่บรรจุ section break ให้สูง 1pt (ไม่ดันหน้าว่าง)
   5) ตัด style ID ซ้ำ (เก็บนิยามล่าสุด)   6) รูปซ้ำเก็บไฟล์เดียว */
async function lpFinalize(blob){
  await ensureZip();
  const zip = await JSZip.loadAsync(blob);
  const rd = n => zip.file(n).async('string');
  let doc = await rd('word/document.xml');
  doc = doc.replace(/<w:fldChar w:fldCharType="begin" w:dirty="true"\/><w:instrText xml:space="preserve">PAGEREF ([^<\s]+)<\/w:instrText><w:fldChar w:fldCharType="end"\/><\/w:r>/g,
    (m, bm) => `<w:fldChar w:fldCharType="begin" w:dirty="true"/></w:r><w:r><w:instrText xml:space="preserve"> PAGEREF ${bm} \\h </w:instrText></w:r><w:r><w:fldChar w:fldCharType="separate"/></w:r><w:r><w:t xml:space="preserve"></w:t></w:r><w:r><w:fldChar w:fldCharType="end"/></w:r>`);
  doc = doc.replace(/<w:p><w:pPr><w:sectPr/g, '<w:p><w:pPr><w:pStyle w:val="PageStart"/><w:sectPr');
  zip.file('word/document.xml', doc);
  // style ซ้ำ
  let sty = await rd('word/styles.xml'); const seen = new Map();
  const styles = [...sty.matchAll(/<w:style\b[^>]*w:styleId="([^"]+)"[\s\S]*?<\/w:style>/g)];
  styles.forEach(m => seen.set(m[1], m.index));
  for (let k = styles.length - 1; k >= 0; k--) { const m = styles[k]; if (seen.get(m[1]) !== m.index) sty = sty.slice(0, m.index) + sty.slice(m.index + m[0].length); }
  zip.file('word/styles.xml', sty);
  // relationships ของ document
  let rels = await rd('word/_rels/document.xml.rels');
  if (!/relationships\/fontTable"/.test(rels)) rels = rels.replace('</Relationships>', '<Relationship Id="rIdFontTable" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/fontTable" Target="fontTable.xml"/></Relationships>');
  const byHash = {};
  for (const name of Object.keys(zip.files).filter(n => n.startsWith('word/media/') && !zip.files[n].dir)) {
    const b = await zip.file(name).async('base64'); const short = name.slice(5);
    if (byHash[b]) { rels = rels.split('Target="' + short + '"').join('Target="' + byHash[b] + '"'); zip.remove(name); } else byHash[b] = short; }
  zip.file('word/_rels/document.xml.rels', rels);
  // ฝังฟอนต์
  const guid = () => '{' + 'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g, () => '0123456789ABCDEF'[Math.floor(Math.random() * 16)]) + '}';
  const obfuscate = (bytes, key) => { const hex = key.replace(/[{}-]/g, ''); const kb = []; for (let i = 0; i < 16; i++) kb.push(parseInt(hex.substr(30 - i * 2, 2), 16)); const out = new Uint8Array(bytes); for (let i = 0; i < 32; i++) out[i] ^= kb[i % 16]; return out; };
  const fonts = [['embedRegular', LP_TTF_R, 'font1.odttf'], ['embedBold', LP_TTF_B, 'font2.odttf']];
  let frels = '', embeds = '';
  fonts.forEach(([tag, b64, name], k) => { const key = guid(); zip.file('word/fonts/' + name, obfuscate(dataUrlBytes('data:;base64,' + b64), key)); frels += `<Relationship Id="rIdF${k + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/font" Target="fonts/${name}"/>`; embeds += `<w:${tag} r:id="rIdF${k + 1}" w:fontKey="${key}"/>`; });
  zip.file('word/_rels/fontTable.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${frels}</Relationships>`);
  let ft = await rd('word/fontTable.xml');
  if (!/xmlns:r=/.test(ft)) ft = ft.replace('<w:fonts ', '<w:fonts xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" ');
  ft = ft.replace(/<w:fonts([^>]*?)\/>\s*$/, '<w:fonts$1></w:fonts>');
  if (!/<\/w:fonts>\s*$/.test(ft)) throw new Error('ฝังฟอนต์ไม่สำเร็จ: fontTable.xml ไม่ถูกต้อง');
  ft = ft.replace(/<\/w:fonts>\s*$/, `<w:font w:name="${LPD.font}"><w:altName w:val="TH SarabunPSK"/><w:charset w:val="DE"/><w:family w:val="swiss"/><w:pitch w:val="variable"/>${embeds}</w:font></w:fonts>`);
  zip.file('word/fontTable.xml', ft);
  let ct = await rd('[Content_Types].xml');
  if (!ct.includes('Extension="odttf"')) ct = ct.replace(/(<Types[^>]*>)/, '$1<Default Extension="odttf" ContentType="application/vnd.openxmlformats-officedocument.obfuscatedFont"/>');
  if (!ct.includes('/word/fontTable.xml')) ct = ct.replace('</Types>', '<Override PartName="/word/fontTable.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.fontTable+xml"/></Types>');
  zip.file('[Content_Types].xml', ct);
  let se = await rd('word/settings.xml');
  if (!se.includes('embedTrueTypeFonts')) se = se.replace(/(<w:settings[^>]*>)/, '$1<w:embedTrueTypeFonts/><w:saveSubsetFonts w:val="false"/>');
  zip.file('word/settings.xml', se);
  return zip.generateAsync({type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

/* ---- PDF + QA (เซิร์ฟเวอร์ Railway: LibreOffice เรนเดอร์ DOCX ไฟล์เดียวกัน แล้วตรวจทุกหน้า) ---- */
async function lpServerRender(blob, want){
  // เวอร์ชัน Railway: claude-shim.js ตั้ง window.ttServer = ข้อมูล /api/info; บน claude.ai ไม่มีเซิร์ฟเวอร์
  const info = window.ttServer ? await window.ttServer : {};
  if (!info.render) return null;
  const buf = new Uint8Array(await blob.arrayBuffer()); let bin = ''; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  const r = await fetch('api/render', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({docx: btoa(bin), want})});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('render HTTP ' + r.status));
  return j;
}
const b64Blob = (b64, type) => new Blob([dataUrlBytes('data:;base64,' + b64)], {type});

async function lpExport(fmt, skipCheck){
  if (!S.dl) { toast('หน้านี้ดาวน์โหลดไฟล์ไม่ได้ในมุมมองนี้'); return; }
  const p = LP.draft; if (!p) return;
  if (!skipCheck) {
    const v = lpValidate(p);
    if (v.errors.length || v.warns.length || v.bib.incomplete.length) { S.modal = {type: 'lpCheck', fmt, v}; renderModal(); return; }
  }
  S.exporting = true; render();
  try {
    await ensureDocx();
    const model = lpBuildModel(p);
    let blob = await lpFinalize(await window.docx.Packer.toBlob(lpModelToDocx(model)));
    const name = 'lesson-plan_' + String(p.code || 'plan').replace(/[^0-9A-Za-z-]/g, '');
    let rendered = null;
    try { rendered = await lpServerRender(blob, fmt === 'pdf' ? 'pdf' : 'docx'); } catch (e) { if (fmt === 'pdf') throw e; }
    if (fmt === 'docx') {
      if (rendered && rendered.docx) blob = b64Blob(rendered.docx, 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
      await S.dl.save({filename: name + '.docx', data: blob});
    } else if (rendered && rendered.pdf) {
      await S.dl.save({filename: name + '.pdf', data: b64Blob(rendered.pdf, 'application/pdf')});
    } else { S.modal = {type: 'lpNoPdf'}; renderModal(); return; }
    const qa = rendered && rendered.qa;
    if (qa && qa.issues && qa.issues.length) { S.modal = {type: 'lpQa', qa, fmt}; renderModal(); }
    else toast(qa ? `ส่งไฟล์แล้ว · ตรวจอัตโนมัติ ${qa.pages} หน้า ไม่พบปัญหา` : fmt === 'docx' ? 'ส่งไฟล์ Word แล้ว เปิดใน Word แล้วกด “ใช่/Yes” เพื่ออัปเดตเลขหน้าสารบัญ' : 'ส่งไฟล์แล้ว');
  } catch (e) { toast(e && e.code === 'declined' ? 'ยกเลิกการดาวน์โหลด' : 'สร้างไฟล์ไม่สำเร็จ: ' + (e && (e.code || e.message) || 'ไม่ทราบสาเหตุ')); }
  finally { S.exporting = false; render(); }
}

/* ---- logo upload (settings) ---- */
function lpLogoFile(file){
  if (!file) return; const rd = new FileReader();
  rd.onload = () => { const im = new Image(); im.onload = () => { const s = Math.min(1, 260 / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); setM(['settings', 'logo'], c.toDataURL('image/png')); toast('บันทึกตราสถานศึกษาแล้ว'); }; im.src = rd.result; };
  rd.readAsDataURL(file);
}

/* ---------- boot ---------- */
applyFsz();
render();
(async () => {
  for (let i = 0; i < 30 && !(window.claude && window.claude.use); i++) await new Promise(r => setTimeout(r, 100));
  if (!(window.claude && window.claude.use)) { S.dbTried = true; S.loaded.m = true; render(); return; }
  const [db, dl] = await Promise.all([window.claude.use('db'), window.claude.use('downloads')]);
  S.db = db; S.dl = dl; S.dbTried = true;
  if (!db) { S.loaded.m = true; render(); return; }
  const onErr = e => { S.online = false; render(); if (e && e.code !== 'revoked') toast('การเชื่อมต่อข้อมูลขาดหาย รีเฟรชหน้าเพื่อเชื่อมใหม่'); };
  db.doc('tt/master').onSnapshot(snap => { S.loaded.m = true; S.online = true; S.exists.master = snap.exists; S.master = snap.exists ? JSON.parse(JSON.stringify(snap.data())) : null; render(); }, onErr);
  lpSubscribe(db);
  window.claude.use('sample').then(sm => { S.sample = sm; if (S.tab === 'lp') render(); }).catch(() => {});
  db.doc('tt/plan').onSnapshot(snap => { S.loaded.p = true; S.exists.plan = snap.exists; S.plan = snap.exists ? JSON.parse(JSON.stringify(snap.data())) : {slots:{}}; if (!S.plan.slots) S.plan.slots = {}; render(); }, onErr);
})();
})();
