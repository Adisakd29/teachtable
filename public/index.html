<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ตารางสอนแผนกอิเล็กทรอนิกส์</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Sarabun:wght@400;700&display=swap">
<style>
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --sunk:#E8EDEA; --ink:#15211C; --muted:#5A6B63; --line:#D3DDD8;
  --accent:#0E6B4F; --accent-ink:#FFFFFF; --accent-soft:#D6EDE3;
  --copper:#B06A1F; --copper-soft:#F6E6D2;
  --bad:#B8332F; --bad-soft:#F8DEDC; --warn:#9A6B00; --warn-soft:#FAEFCF;
  --blk-l:93%; --blk-c:0.045; --blk-ink:#1B2621;
  --shadow:0 1px 2px rgba(20,40,30,.08),0 4px 16px rgba(20,40,30,.06);
  --f-display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1512; --surface:#151F1B; --sunk:#1B2823; --ink:#E3ECE7; --muted:#93A59C; --line:#2A3A33;
    --accent:#3FBF8C; --accent-ink:#06140E; --accent-soft:#16372A;
    --copper:#E3A35C; --copper-soft:#3A2A17;
    --bad:#F07A74; --bad-soft:#3D1D1B; --warn:#E8C064; --warn-soft:#3A3016;
    --blk-l:31%; --blk-c:0.05; --blk-ink:#EAF2EE;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1512; --surface:#151F1B; --sunk:#1B2823; --ink:#E3ECE7; --muted:#93A59C; --line:#2A3A33;
  --accent:#3FBF8C; --accent-ink:#06140E; --accent-soft:#16372A;
  --copper:#E3A35C; --copper-soft:#3A2A17;
  --bad:#F07A74; --bad-soft:#3D1D1B; --warn:#E8C064; --warn-soft:#3A3016;
  --blk-l:31%; --blk-c:0.05; --blk-ink:#EAF2EE;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:17px/1.55 var(--f-body);padding-inline:16px;padding-block:0 40px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;padding-block:20px 12px;max-width:1500px;margin:0 auto}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.mark{width:46px;height:46px;flex:none;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.brand h1{font-size:26px;line-height:1.15}
.brand p{margin:2px 0 0;color:var(--muted);font-size:16px}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--sunk);padding:4px;border-radius:10px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:500;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
main{max-width:1500px;margin:0 auto}
.status{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);padding-bottom:10px;max-width:1500px;margin:0 auto}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--accent)}

/* board */
.board{display:grid;grid-template-columns:370px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.board{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--sunk);padding:3px;border-radius:8px}
.seg button{border:0;background:transparent;padding:6px 4px;border-radius:6px;font-size:16px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
select,input[type=text],input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 9px;width:100%;min-width:0}
.meter{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.clist{display:flex;flex-direction:column;gap:6px;max-height:62vh;overflow:auto;margin-inline:-4px;padding-inline:4px}
@media (max-width:900px){.clist{max-height:none}}
.crow{border:1px solid var(--line);border-radius:9px;padding:8px 10px;display:grid;gap:4px;border-left:4px solid oklch(62% 0.12 var(--h))}
.crow.done{opacity:.6}
.linkbtn{border:0;background:none;padding:0 2px;color:var(--accent);font-size:13px;font-weight:500;text-decoration:underline;text-underline-offset:2px}
.trow{display:flex;gap:8px;align-items:center;font-size:14px}
.tsel{padding:2px 6px;font-size:14px;max-width:220px}
.tbox{border:1px solid var(--line);border-radius:9px;padding:10px;display:grid;gap:8px;background:var(--sunk)}
.tbox .kv{font-size:14px;grid-template-columns:100px 1fr}
.opts{display:grid;gap:6px;font-size:16px}
.opts label{display:flex;gap:8px;align-items:center}
.lpboard{grid-template-columns:330px minmax(0,1fr)}
.lpside{gap:10px}
.lplist{display:flex;flex-direction:column;gap:6px;max-height:34vh;overflow:auto}
.lpitem{display:grid;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px}
.lpitem span{font-size:14px;color:var(--muted)}
.lpitem[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.lpnav{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:8px}
.lpnav button{border:0;background:none;text-align:left;padding:6px 8px;border-radius:7px;color:var(--ink)}
.lpnav button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.lpnav button.add{color:var(--accent)}
.lpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.lpf{display:grid;gap:4px}
.lpf.wide{grid-column:1/-1}
.lpf>span{font-weight:600;font-size:15px}
.lpf small{color:var(--muted);font-size:13px}
.lpf textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;resize:vertical;font:inherit;line-height:1.55;color:inherit}
.lpcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:10px}
.lpcard summary{cursor:pointer;font-weight:600}
.lpcard .kind{padding:1px 8px;border-radius:5px;color:#1b2621;font-size:14px}
.lptask{border-left:3px solid var(--line);padding-left:10px;display:grid;gap:8px}
.lph{font-size:17px;margin-top:6px}
.note{margin:0;padding:8px 12px;border-radius:8px;background:var(--warn-soft);color:var(--ink);font-size:15px}
.btn.ai{border-color:var(--copper);color:var(--copper)}
.lpt input{width:100%;min-width:44px;padding:3px 5px}
.lpt td:nth-child(2) input{min-width:220px}
.lpt th.vert{writing-mode:vertical-rl;transform:rotate(180deg);font-size:13px;padding:6px 2px;height:96px}
@media (max-width:900px){.lpboard{grid-template-columns:minmax(0,1fr)}}
.crow .nm{font-weight:600;font-size:16px;line-height:1.35}
.crow .sub{font-size:14px;color:var(--muted)}
.chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.chip{border:1px dashed var(--copper);background:var(--copper-soft);color:var(--ink);border-radius:6px;padding:1px 9px;font-size:14px;font-family:var(--f-mono)}
.chip[aria-pressed="true"]{background:var(--copper);color:var(--surface);border-style:solid}
.tag{font-size:13px;padding:0 6px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.ok{background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}

.gridwrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ghead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.ghead h2{font-size:24px}
.ghead .meta{color:var(--muted);font-size:16px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:500;font-size:16px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.pickbar{display:flex;gap:10px;align-items:center;background:var(--copper-soft);border:1px solid var(--copper);border-radius:8px;padding:6px 10px;font-size:16px;flex-wrap:wrap}
.scroll{overflow-x:auto}
.tt{display:grid;grid-template-columns:84px repeat(3,minmax(96px,1fr)) 32px repeat(8,minmax(96px,1fr));grid-auto-rows:auto;min-width:1220px;position:relative}
.tt .h{font-size:13px;color:var(--muted);text-align:center;padding:4px 2px;border-bottom:1px solid var(--line)}
.tt .h b{display:block;font-family:var(--f-display);font-size:16px;color:var(--ink)}
.tt .h.eve b{color:var(--muted)}
.tt .day{font-family:var(--f-display);font-weight:600;display:flex;align-items:center;padding-left:4px;border-bottom:1px solid var(--line);min-height:96px}
.tt .cell{border-bottom:1px solid var(--line);border-left:1px solid var(--line);min-height:96px;background:transparent;border-top:0;border-right:0;padding:0;position:relative}
.tt .cell.eve{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--sunk) 6px 7px)}
.tt .cell.ok{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent);cursor:copy}
.tt .cell.no{cursor:not-allowed}
.tt .cell.drop{background:var(--accent);opacity:.5}
.tt .lunch{grid-column:5;z-index:0;border-left:1px solid var(--line);background:var(--sunk);writing-mode:vertical-rl;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);letter-spacing:.1em}
.blk{margin:3px;border-radius:7px;padding:5px 8px;background:oklch(var(--blk-l) var(--blk-c) var(--h));color:var(--blk-ink);border:1px solid oklch(60% 0.08 var(--h) / .5);font-size:14px;line-height:1.3;text-align:left;display:flex;flex-direction:column;gap:1px;overflow:hidden;z-index:1;position:relative}
.blk .n{font-weight:600;font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.blk .s{opacity:.8;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.bad{border:2px solid var(--bad)}
.blk.sel{outline:2px solid var(--copper);outline-offset:1px}
.blk .lk{font-size:13px;opacity:.75;order:9}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}

/* check + data */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:31px;line-height:1.1}
.stat span{font-size:14px;color:var(--muted)}
.stat.bad b{color:var(--bad)}
.stat.good b{color:var(--accent)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-top:14px}
.sec h3{font-size:19px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:14px;color:var(--muted);font-weight:500;white-space:nowrap}
td input,td select{padding:4px 6px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:16px}
.subtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(520px,100%);max-height:88vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.modal h3{font-size:22px}
.modal.wide{width:min(860px,100%)}
.modal textarea{width:100%;font:inherit;font-size:14px;line-height:1.5;border:1px solid var(--line);border-radius:7px;padding:8px;background:var(--surface);color:inherit;resize:vertical}
.modal .step{font-weight:700;font-size:16px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:16px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:4px 10px;font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;z-index:60;font-size:16px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.blk,.cell{transition:background .12s}}
.fsz{display:flex;gap:2px;align-items:center;margin-left:auto}
.fsz button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 8px;line-height:1.6;color:var(--muted)}
.fsz button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
</style>

<script src="claude-shim.js"></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="mark" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent-ink)" stroke-width="1.8" stroke-linecap="round"><rect x="6" y="6" width="12" height="12" rx="1.5"/><path d="M9 6V3M12 6V3M15 6V3M9 21v-3M12 21v-3M15 21v-3M6 9H3M6 12H3M6 15H3M21 9h-3M21 12h-3M21 15h-3"/></svg></div>
    <div><h1 id="appTitle">ตารางสอน แผนกอิเล็กทรอนิกส์</h1><p id="appSub">กำลังโหลด…</p></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<div class="status"><span class="dot" id="dot"></span><span id="statusText">กำลังเชื่อมต่อข้อมูลกลาง…</span><span class="fsz" id="fsz" role="group" aria-label="ขนาดตัวอักษร"><span>ขนาดตัวอักษร</span><button data-act="fsz" data-v="1" style="font-size:14px">ก</button><button data-act="fsz" data-v="1.15" style="font-size:17px">ก</button><button data-act="fsz" data-v="1.3" style="font-size:20px">ก</button></span></div>
<main id="main"><div class="empty">กำลังโหลดข้อมูล…</div></main>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
(() => {
const DAYS = ['จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์'];
const TIMES = {1:'08.30–09.30',2:'09.30–10.30',3:'10.30–11.30',4:'12.30–13.30',5:'13.30–14.30',6:'14.30–15.30',7:'15.30–16.30',8:'16.30–17.30',9:'17.30–18.30',10:'18.30–19.30',11:'19.30–20.30'};
const NP = 11;
const DEPT_KIND = 'แผนกอิเล็กทรอนิกส์';

const S = {
  master: null, plan: {slots:{}}, loaded: {m:false,p:false}, db: null, dl: null, online: false,
  tab: 'board', mode: 'group', sel: {group:'', teacher:'', room:''},
  pick: null, focus: null, modal: null, dataTab: 'courses', pendingRender: false, busy: false, filter: '', exists: {master:false, plan:false}
};
try { const saved = JSON.parse(localStorage.getItem('tt-ui') || '{}'); Object.assign(S.sel, saved.sel || {}); if (saved.mode) S.mode = saved.mode; if (saved.tab) S.tab = saved.tab; } catch(e) {}
let FSZ = '1'; try { FSZ = localStorage.getItem('tt-fsz') || '1'; } catch(e) {}
function applyFsz(){ document.body.style.zoom = FSZ; document.querySelectorAll('#fsz button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === FSZ))); }
function saveUi(){ try { localStorage.setItem('tt-ui', JSON.stringify({sel:S.sel, mode:S.mode, tab:S.tab})); } catch(e) {} }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const live = o => Object.entries(o || {}).filter(([k,v]) => v && typeof v === 'object');
const M = () => S.master;
const courses = () => live(M().courses);
const slots = () => live(S.plan.slots).filter(([id,s]) => M().courses[s.course] && M().courses[s.course] !== null);
const subj = c => (M().subjects[c.subject]) || {name:'(ไม่พบวิชา)', code:'', t:0, p:0, c:0};
const tName = id => (M().teachers[id] && M().teachers[id].short) || '';
const gName = id => (M().groups[id] && M().groups[id].name) || '?';
const rName = id => (M().rooms[id] && M().rooms[id].name) || '';
const gNames = c => (c.groups || []).map(gName).join(', ');
const tIds = c => [...new Set([c.teacher, ...(c.coTeachers || [])].filter(Boolean))];
const tLabel = c => { const ids = tIds(c); if (!ids.length) return ''; if (ids.length > 3) return 'ครู ' + ids.length + ' คน'; return ids.map(tName).join(', '); };
const EXTRA_RE = /home\s*room|โฮมรูม|^\s*plc\b/i;
const isExtra = c => !!(c && (c.extra || (M().subjects[c.subject] || {}).extra || EXTRA_RE.test((M().subjects[c.subject] || {}).name || '')));
const cHours = c => isExtra(c) ? 0 : (c.hours || 0);
const hue = str => { let h = 2166136261; for (const ch of String(str)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return Math.round((h % 1000) * 137.508) % 360; };
const sortBy = (arr, f) => arr.slice().sort((a,b) => { const x=f(a), y=f(b); return x < y ? -1 : x > y ? 1 : 0; });
const crossesLunch = (st, len) => st <= 3 && st + len - 1 >= 4;
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const patternOf = c => String(c.pattern || c.hours || '').split('+').map(x => parseInt(x,10)).filter(x => x > 0);
const deptRooms = () => sortBy(live(M().rooms).filter(([id,r]) => r.kind === DEPT_KIND), ([id,r]) => r.name);
const settings = () => M().settings || {};
const sortedGroups = () => sortBy(live(M().groups), ([id,g]) => String(g.order ?? 999).padStart(4,"0") + g.name);
const sortedTeachers = () => sortBy(live(M().teachers), ([id,t]) => t.short || t.name);

function toast(msg){ const r = $('#toastRoot'); r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => r.innerHTML = '', msg.length > 60 ? 8000 : 3200); }

function courseSlots(cid){ return slots().filter(([id,s]) => s.course === cid); }
function remaining(cid){
  const c = M().courses[cid]; const placed = courseSlots(cid).map(([id,s]) => s.len);
  const sum = placed.reduce((a,b) => a+b, 0); const rem = (c.hours || 0) - sum;
  if (rem <= 0) return [];
  const pat = patternOf(c); const left = pat.slice();
  for (const l of placed) { const i = left.indexOf(l); if (i >= 0) left.splice(i,1); }
  const tot = left.reduce((a,b) => a+b, 0);
  return tot === rem ? left : [rem];
}

/* ---------- occupancy & conflicts ---------- */
function slotKeys(s){
  const c = M().courses[s.course]; if (!c) return [];
  const ks = [];
  for (let p = s.start; p < s.start + s.len; p++) {
    const t = `${s.day}:${p}`;
    for (const tid of tIds(c)) ks.push(`T|${tid}|${t}`);
    for (const g of c.groups || []) ks.push(`G|${g}|${t}`);
    if (s.room && M().rooms[s.room] && !M().rooms[s.room].shared) ks.push(`R|${s.room}|${t}`);
  }
  return ks;
}
function buildOcc(list){
  const occ = new Map();
  for (const [id,s] of (list || slots())) for (const k of slotKeys(s)) { if (!occ.has(k)) occ.set(k, []); occ.get(k).push(id); }
  return occ;
}
function conflicts(cand, ignore, occ){
  const out = []; const c = M().courses[cand.course];
  if (cand.start < 1 || cand.start + cand.len - 1 > NP) return ['เกินช่วงคาบที่มี'];
  const seen = new Set();
  for (const k of slotKeys(cand)) {
    const others = (occ.get(k) || []).filter(x => x !== ignore);
    for (const o of others) {
      const kind = k[0]; const key = kind + o; if (seen.has(key)) continue; seen.add(key);
      const os = S.plan.slots[o]; const oc = M().courses[os.course]; const on = subj(oc).name;
      if (kind === 'T') out.push(`${tName(k.split('|')[1])} สอน "${on}" (${gNames(oc)}) อยู่แล้ว`);
      else if (kind === 'G') out.push(`กลุ่ม ${gName(k.split('|')[1])} เรียน "${on}" อยู่แล้ว`);
      else out.push(`ห้อง ${rName(cand.room)} ถูกใช้โดย "${on}"`);
    }
  }
  return out;
}
function roomFree(room, day, start, len, ignore, occ){
  if (!room) return true; const r = M().rooms[room]; if (!r || r.shared) return true;
  for (let p = start; p < start + len; p++) if ((occ.get(`R|${room}|${day}:${p}`) || []).some(x => x !== ignore)) return false;
  return true;
}
function chooseRoom(c, day, start, len, ignore, occ){
  if (c.roomMode === 'none') return c.room || '';
  const cands = [c.room, ...deptRooms().map(([id]) => id)].filter(Boolean);
  for (const r of cands) if (roomFree(r, day, start, len, ignore, occ)) return r;
  return '';
}

/* ---------- writes ---------- */
let chain = Promise.resolve();
function deepMerge(t, p){ for (const [k,v] of Object.entries(p)) { if (v && typeof v === 'object' && !Array.isArray(v) && t[k] && typeof t[k] === 'object') deepMerge(t[k], v); else t[k] = v; } }
function write(doc, patch){
  deepMerge(doc === 'plan' ? S.plan : S.master, JSON.parse(JSON.stringify(patch)));
  render();
  if (!S.db) { toast('ยังไม่ได้เชื่อมต่อข้อมูลกลาง การแก้ไขนี้จะไม่ถูกบันทึก'); return; }
  const ref = S.db.doc('tt/' + doc);
  chain = chain.then(() => S.exists[doc] ? ref.update(patch) : ref.set(JSON.parse(JSON.stringify(doc === 'plan' ? S.plan : S.master))).then(() => { S.exists[doc] = true; })).catch(e => {
    if (e && e.code === 'invalid_argument') toast('บันทึกไม่ได้ อาจไม่มีสิทธิ์แก้ไข (ต้องเป็นผู้ร่วมแก้ไข)');
    else toast('บันทึกไม่สำเร็จ ลองอีกครั้ง (' + (e && e.code || 'error') + ')');
  });
}
const setSlot = (id, v) => write('plan', {slots: {[id]: v}});
const setM = (path, v) => { const o = {}; let cur = o; path.forEach((k,i) => { if (i === path.length - 1) cur[k] = v; else cur = cur[k] = {}; }); write('master', o); };

/* ---------- placement ---------- */
function placeCourse(cid, len, day, start){
  const occ = buildOcc(); const c = M().courses[cid];
  const room = chooseRoom(c, day, start, len, null, occ);
  const cand = {course: cid, day, start, len, room};
  const errs = conflicts(cand, null, occ);
  if (errs.length) { toast(errs[0]); return false; }
  setSlot(uid('s'), {...cand, locked: false});
  if (c.roomMode !== 'none' && !room) toast('วางแล้ว แต่ไม่มีห้องแผนกว่างในช่วงนี้');
  return true;
}
function moveSlot(sid, day, start){
  const s = S.plan.slots[sid]; const occ = buildOcc(); const c = M().courses[s.course];
  let room = s.room;
  if (!roomFree(room, day, start, s.len, sid, occ)) room = chooseRoom(c, day, start, s.len, sid, occ);
  const cand = {...s, day, start, room};
  const errs = conflicts(cand, sid, occ);
  if (errs.length) { toast(errs[0]); return false; }
  setSlot(sid, {day, start, room});
  return true;
}
function candidateStatus(day, start){
  if (!S.pick) return null;
  const occ = S._occ;
  if (S.pick.slot) { const s = S.plan.slots[S.pick.slot]; if (!s) return null; const c = M().courses[s.course];
    let room = s.room; if (!roomFree(room, day, start, s.len, S.pick.slot, occ)) room = chooseRoom(c, day, start, s.len, S.pick.slot, occ);
    return conflicts({...s, day, start, room}, S.pick.slot, occ); }
  const c = M().courses[S.pick.course];
  const room = chooseRoom(c, day, start, S.pick.len, null, occ);
  return conflicts({course:S.pick.course, day, start, len:S.pick.len, room}, null, occ);
}

/* ---------- auto scheduler ---------- */
function autoSchedule(scopeCids){
  const st = settings(); const maxP = Math.min(NP, st.autoMaxPeriod || 8);
  const base = slots();
  const tasks = [];
  for (const cid of scopeCids) { const c = M().courses[cid]; if (!c || c.activity) continue; for (const len of remaining(cid)) tasks.push({cid, len}); }
  if (!tasks.length) return {placed: [], failed: []};
  const tLoad = {}; for (const [cid,c] of courses()) for (const tid of tIds(c)) tLoad[tid] = (tLoad[tid] || 0) + (c.hours || 0);
  const diff = t => { const c = M().courses[t.cid]; return t.len * 10 + (c.groups || []).length * 6 + (tLoad[c.teacher] || 0) * 0.5 + tIds(c).length * 12 + (c.roomMode === 'dept' ? 4 : 0); };
  let best = null;
  const ATT = 40;
  for (let a = 0; a < ATT; a++) {
    const list = base.map(([id,s]) => [id, s]);
    const occ = buildOcc(list);
    const dayLoad = {}; // G|g|day -> hours
    const courseDays = {}; // cid -> Set
    for (const [id,s] of list) { const c = M().courses[s.course]; for (const g of c.groups || []) dayLoad[`${g}|${s.day}`] = (dayLoad[`${g}|${s.day}`] || 0) + s.len; (courseDays[s.course] ||= new Set()).add(s.day); }
    const order = tasks.map(t => ({...t, k: diff(t) + (a ? Math.random() * 14 : 0)})).sort((x,y) => y.k - x.k);
    const placed = [], failed = [];
    for (let qi = 0; qi < order.length; qi++) {
      const t = order[qi];
      const c = M().courses[t.cid]; let bestC = null;
      for (let d = 0; d < 5; d++) for (let p = 1; p + t.len - 1 <= maxP; p++) {
        if (crossesLunch(p, t.len) && st.autoLunchCross === false) continue;
        const room = chooseRoom(c, d, p, t.len, null, occ);
        if (c.roomMode === 'dept' && !room) continue;
        const cand = {course: t.cid, day: d, start: p, len: t.len, room};
        let clash = false; for (const k of slotKeys(cand)) if (occ.has(k)) { clash = true; break; }
        if (clash) continue;
        let score = Math.random() * (a ? 3 : 0.5);
        if (courseDays[t.cid] && courseDays[t.cid].has(d)) score += 30;
        for (const g of c.groups || []) { const L = (dayLoad[`${g}|${d}`] || 0) + t.len; if (L > (st.maxPerDay || 7)) score += (L - (st.maxPerDay || 7)) * 12; score += L * 0.6; }
        score += (p + t.len - 1 > 7 ? 8 : 0) + p * 0.3;
        if (p === 1 || p === 4) score -= 2;
        if (crossesLunch(p, t.len)) score += 5;
        if (c.room && room !== c.room) score += 3;
        if (!bestC || score < bestC.score) bestC = {score, cand};
      }
      if (!bestC) {
        if (t.len >= 4 && !t.split) { const h1 = Math.ceil(t.len / 2); order.push({cid: t.cid, len: h1, split: true}, {cid: t.cid, len: t.len - h1, split: true}); }
        else failed.push(t);
        continue;
      }
      const id = uid('s'); const s = {...bestC.cand, locked: false};
      list.push([id, s]); placed.push([id, s]);
      for (const k of slotKeys(s)) { if (!occ.has(k)) occ.set(k, []); occ.get(k).push(id); }
      for (const g of c.groups || []) dayLoad[`${g}|${s.day}`] = (dayLoad[`${g}|${s.day}`] || 0) + s.len;
      (courseDays[t.cid] ||= new Set()).add(s.day);
    }
    const failH = failed.reduce((x,t) => x + t.len, 0);
    if (!best || failH < best.failH) best = {placed, failed, failH};
    if (!failH) break;
  }
  return best;
}
function runAuto(scope){
  const cids = scope === 'view' ? viewCourses().map(([id]) => id) : courses().map(([id]) => id);
  S.busy = true; render();
  setTimeout(() => {
    const r = autoSchedule(cids); S.busy = false;
    if (!r.placed.length && !r.failed.length) { render(); toast('ทุกวิชาถูกจัดครบแล้ว'); return; }
    const patch = {}; for (const [id,s] of r.placed) patch[id] = s;
    if (r.placed.length) write('plan', {slots: patch}); else render();
    const fh = r.failed.reduce((x,t) => x + t.len, 0);
    toast(`จัดเพิ่ม ${r.placed.reduce((x,[i,s]) => x + s.len, 0)} ชม.` + (fh ? ` · วางไม่ได้ ${fh} ชม. (ดูแท็บตรวจสอบ)` : ' · ครบทุกวิชา'));
  }, 30);
}

function viewCourses(){

  if (S.mode === 'teacher') return courses().filter(([cid,c]) => tIds(c).includes(id));

function viewSlots(){

function entityOptions(mode){

function allConflicts(){

}

function courseRow(cid, c){

function renderCheck(){
  const bad = allConflicts();
  const cs = courses();
  const need = cs.reduce((a,[i,c]) => a + cHours(c), 0);
  const have = slots().filter(([i,s]) => !isExtra(M().courses[s.course])).reduce((a,[i,s]) => a + s.len, 0);
  const unplaced = cs.filter(([cid]) => remaining(cid).length);
  const noT = cs.filter(([cid,c]) => !tIds(c).length);
  // conflict list
  const occ = buildOcc(); const rows = [];
  const seen = new Set();
  for (const [k, ids] of occ) if (ids.length > 1) {
    const [kind, ent, dp] = k.split('|'); const [d,p] = dp.split(':');
    const key = kind + ent + d + ids.slice().sort().join(); if (seen.has(key)) continue; seen.add(key);
    rows.push({kind, ent, d:+d, p:+p, ids});
  }
  const kindName = {T:'ครู', G:'กลุ่มเรียน', R:'ห้อง'};
  const entName = (k,e) => k==='T' ? tName(e) : k==='G' ? gName(e) : rName(e);
  const tl = {}; for (const [cid,c] of cs) if (!isExtra(c)) for (const tid of tIds(c)) { tl[tid] ||= {need:0, have:0}; tl[tid].need += c.hours||0; tl[tid].have += courseSlots(cid).reduce((a,[i,s]) => a+s.len, 0); }
  const gl = {}; for (const [gid] of sortedGroups()) gl[gid] = {need:0, have:0, days:[0,0,0,0,0]};
  for (const [cid,c] of cs) for (const g of c.groups||[]) if (gl[g]) { gl[g].need += cHours(c); }
  for (const [sid,s] of slots()) if (!isExtra(M().courses[s.course])) for (const g of M().courses[s.course].groups||[]) if (gl[g]) { gl[g].have += s.len; gl[g].days[s.day] += s.len; }

  $('#main').innerHTML = `
  <div class="cards">
    <div class="stat ${have>=need?'good':''}"><b class="num">${have}/${need}</b><span>ชั่วโมงที่จัดแล้ว / ต้องจัด</span></div>
    <div class="stat ${rows.length?'bad':'good'}"><b class="num">${rows.length}</b><span>จุดที่เวลาชนกัน</span></div>
    <div class="stat ${unplaced.length?'':'good'}"><b class="num">${unplaced.length}</b><span>รายวิชาที่ยังจัดไม่ครบ</span></div>
    <div class="stat"><b class="num">${noT.length}</b><span>รายวิชาที่ยังไม่ระบุครู</span></div>
  </div>
  <div class="sec"><h3>เวลาชนกัน</h3>${rows.length ? `<div class="tbl"><table><thead><tr><th>ประเภท</th><th>ชื่อ</th><th>วัน / คาบ</th><th>วิชาที่ชน</th></tr></thead><tbody>${rows.map(r => `<tr><td><span class="tag bad">${kindName[r.kind]}</span></td><td>${esc(entName(r.kind,r.ent))}</td><td class="num">${DAYS[r.d]} ${r.p}</td><td>${r.ids.map(i => esc(subj(M().courses[S.plan.slots[i].course]).name) + ' <span class="muted">(' + esc(gNames(M().courses[S.plan.slots[i].course])) + ')</span>').join('<br>')}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted" style="margin:0">ไม่มีเวลาชนกัน</p>'}</div>
  <div class="sec"><h3>รายวิชาที่ยังจัดไม่ครบ</h3>${unplaced.length ? `<div class="tbl"><table><thead><tr><th>วิชา</th><th>กลุ่ม</th><th>ครู</th><th>เหลือ</th><th></th></tr></thead><tbody>${unplaced.map(([cid,c]) => `<tr><td>${esc(subj(c).name)}</td><td>${esc(gNames(c))}</td><td>${esc(tLabel(c)||'—')}</td><td class="num">${remaining(cid).join('+')} คาบ</td><td><button class="btn" data-act="goto" data-g="${c.groups[0] || ''}" data-t="${c.teacher || ''}">ไปที่ตาราง</button></td></tr>`).join('')}</tbody></table></div>` : '<p class="muted" style="margin:0">จัดครบทุกวิชาแล้ว</p>'}</div>
  <div class="sec"><h3>ภาระสอนของครู</h3><div class="tbl"><table><thead><tr><th>ครู</th><th>จัดแล้ว / ตามรายวิชา (ชม./สัปดาห์)</th></tr></thead><tbody>${sortedTeachers().filter(([id]) => tl[id]).map(([id,t]) => `<tr><td>${esc(t.name)}</td><td class="num">${tl[id].have} / ${tl[id].need}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="sec"><h3>ชั่วโมงเรียนต่อวันของแต่ละกลุ่ม</h3><div class="tbl"><table><thead><tr><th>กลุ่ม</th>${DAYS.map(d => `<th>${d}</th>`).join('')}<th>รวม</th></tr></thead><tbody>${sortedGroups().map(([id,g]) => `<tr><td>${esc(g.name)}</td>${gl[id].days.map(x => `<td class="num" ${x>(settings().maxPerDay||7)?'style="color:var(--bad);font-weight:600"':''}>${x}</td>`).join('')}<td class="num">${gl[id].have}/${gl[id].need}</td></tr>`).join('')}</tbody></table></div></div>`;
}

/* ---------- backup / restore ---------- */
async function backupJson(){
  if (!S.dl) { toast('หน้านี้ดาวน์โหลดไฟล์ไม่ได้ในมุมมองนี้'); return; }
  const d = new Date(); const stamp = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + '_' + String(d.getHours()).padStart(2,'0') + String(d.getMinutes()).padStart(2,'0');
  const data = JSON.stringify({app: 'electronics-timetable', savedAt: d.toISOString(), master: S.master, plan: S.plan, plans: LP.list});
  try { await S.dl.save({filename: 'timetable-backup_' + stamp + '.json', data}); toast('ดาวน์โหลดไฟล์สำรองแล้ว'); }
  catch (e) { toast(e && e.code === 'declined' ? 'ยกเลิกการดาวน์โหลด' : 'ดาวน์โหลดไม่สำเร็จ'); }
}
function restoreJson(file){
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    let j; try { j = JSON.parse(rd.result); } catch (e) { toast('ไฟล์นี้ไม่ใช่ไฟล์สำรองของระบบ'); return; }
    if (!j || !j.master || !j.master.courses || !j.plan) { toast('ไฟล์นี้ไม่ใช่ไฟล์สำรองของระบบ'); return; }
    const n = live(j.plan.slots).length;

function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function need(globalName, cdnjs, jsd){

  if (has()) return;

  if (!has()) throw new Error('โหลดไลบรารีไม่สำเร็จ');
}

// columns A..P : วัน, รายการ, เข้าแถว, โฮมรูม, คาบ1-3, พัก, คาบ4-11
const FORM_COLS = [7.4, 12.9, 5, 7.1, 11.1, 11.1, 11.1, 7, 11.1, 11.1, 11.1, 11.1, 11.1, 11.1, 11.1, 11.1];
const NC = FORM_COLS.length;
const pcol = p => p <= 3 ? 4 + p : 5 + p;
const GRAY = 'D9D9D9';
const RANK_RE = /^(ว่าที่\s*ร้อย(?:ตรี|โท|เอก)(?:หญิง)?|ร้อย(?:ตรี|โท|เอก)(?:หญิง)?|จ่าสิบ(?:ตรี|โท|เอก)|สิบ(?:ตรี|โท|เอก)|ดร\.)\s*/;

function newSheet(name){ return {name, cols: FORM_COLS.slice(), rh: {1: 21}, cells: {}, merges: [], last: 1}; }
function cellOf(sh, r, c){ const k = r + ',' + c; return sh.cells[k] || (sh.cells[k] = {r, c}); }
function put(sh, r, c, v, st){ const x = cellOf(sh, r, c); x.v = v; if (st) Object.assign(x, st); if (r > sh.last) sh.last = r; return x; }
function sty(sh, r1, c1, r2, c2, st){ for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) Object.assign(cellOf(sh, r, c), st); if (r2 > sh.last) sh.last = r2; }
function mrg(sh, r1, c1, r2, c2){ if (r1 === r2 && c1 === c2) return; sh.merges.push([r1, c1, r2, c2]); }
function box(sh, r1, c1, r2, c2, o = 'thin', h = 'thin', v = 'thin'){
  for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) { const x = cellOf(sh, r, c);
    x.bt = r === r1 ? o : h; x.bb = r === r2 ? o : h; x.bl = c === c1 ? o : v; x.br = c === c2 ? o : v; }
  if (r2 > sh.last) sh.last = r2;
}
function sigBlock(sh, r, c1, c2, name, role){
  const n = String(name || '').trim(); const m = n.match(RANK_RE);
  const rank = m ? m[1] : ''; const pure = m ? n.slice(m[0].length) : n;
  put(sh, r, c1, rank ? '.................................. ' + rank : '..................................................', {al: 'center', fit: true}); mrg(sh, r, c1, r, c2);
  put(sh, r + 1, c1, '(' + pure + ')', {al: 'center', fit: true}); mrg(sh, r + 1, c1, r + 1, c2);
  put(sh, r + 2, c1, role || '', {al: 'center', fit: true}); mrg(sh, r + 2, c1, r + 2, c2);
}
function activityCells(){
  const set = new Set();
  for (const [id,s] of slots()) if (s.locked && M().courses[s.course] && M().courses[s.course].activity) for (let p = s.start; p < s.start + s.len; p++) set.add(s.day + ':' + p);
  return set;
}
function timeGrid(sh, labels, list, valsOf){
  // header rows 3-4
  put(sh, 3, 1, '', {diag: {tr: 'เวลา', bl: 'วัน'}}); mrg(sh, 3, 1, 4, 1);
  put(sh, 3, 2, 'คาบที่'); put(sh, 4, 2, 'เวลา');
  put(sh, 3, 3, '07.40 - 08.30'); mrg(sh, 3, 3, 4, 4);
  for (let p = 1; p <= NP; p++) { put(sh, 3, pcol(p), p); put(sh, 4, pcol(p), TIMES[p].replace('–', ' - '), {fit: true}); }
  put(sh, 3, 8, '11.30'); put(sh, 4, 8, '12.30');
  box(sh, 3, 1, 4, NC); sty(sh, 3, 2, 4, NC, {al: 'center'});
  // body
  box(sh, 5, 1, 19, NC, 'thin', 'dotted', 'thin');
  const act = activityCells();
  DAYS.forEach((dn, d) => {
    const r0 = 5 + d * 3;
    for (let c = 1; c <= NC; c++) { cellOf(sh, r0, c).bt = 'thin'; cellOf(sh, r0 + 2, c).bb = 'thin'; }
    put(sh, r0 + 1, 1, dn, {al: 'center'});
    labels.forEach((l, i) => put(sh, r0 + i, 2, l, {al: 'center', fit: true}));
    for (let p = 1; p <= NP; p++) if (act.has(d + ':' + p)) sty(sh, r0, pcol(p), r0 + 2, pcol(p), {fill: GRAY});
  });
  put(sh, 5, 3, 'กิจกรรมเข้าแถว', {rot: true, al: 'center'}); mrg(sh, 5, 3, 19, 3);
  mrg(sh, 5, 4, 13, 4); put(sh, 14, 4, '/ กิจกรรมโฮมรูม', {al: 'center', wrap: true, size: 10}); mrg(sh, 14, 4, 16, 4); mrg(sh, 17, 4, 19, 4);
  put(sh, 5, 8, 'พัก  60  นาที', {rot: true, al: 'center'}); mrg(sh, 5, 8, 19, 8);
  // slots
  const used = new Set();
  for (const [id,s] of sortBy(list, ([i,x]) => x.day * 100 + x.start)) {
    const r0 = 5 + s.day * 3; const end = s.start + s.len - 1;
    // วิชาที่คร่อมพักกลางวัน: แยกเป็นช่วงเช้ากับช่วงบ่าย ให้คอลัมน์ "พัก 60 นาที" คงเดิม
    const parts = crossesLunch(s.start, s.len) ? [[s.start, 3], [4, end]] : [[s.start, end]];
    const vals = valsOf(s);
    for (const [a, b] of parts) {
      const c1 = pcol(a), c2 = pcol(b);
      let clash = false; for (let c = c1; c <= c2; c++) if (used.has(r0 + ':' + c)) clash = true;
      if (clash) { vals.forEach((v, i) => { const x = cellOf(sh, r0 + i, c1); x.v = [x.v, v].filter(Boolean).join(' / '); }); continue; }
      for (let c = c1; c <= c2; c++) used.add(r0 + ':' + c);
      vals.forEach((v, i) => { put(sh, r0 + i, c1, v, {al: 'center', fit: true, bold: i === 0}); mrg(sh, r0 + i, c1, r0 + i, c2); });
      if (s.locked) sty(sh, r0, c1, r0 + 2, c2, {fill: GRAY});
    }
  }
}

function gShort(ids){
  const names = [...new Set((ids || []).map(gName))]; if (names.length < 2) return names.join('');
  const bases = [...new Set(names.map(n => n.split(' ')[0]))];
  if (bases.length === 1) { const all = live(M().groups).map(([i,g]) => g.name).filter(n => n.split(' ')[0] === bases[0]); if (all.length === names.length && all.every(n => names.includes(n))) return bases[0]; }
  const out = []; let prev = '';
  for (const n of names) { const i = n.indexOf(' '); const base = i > 0 ? n.slice(0, i) : n; const rest = i > 0 ? n.slice(i + 1) : '';
    if (base === prev && rest) out.push(rest); else { out.push(n); prev = rest ? base : ''; } }

async function runExport(format, scope){
  if (!S.dl) { toast('หน้านี้ดาวน์โหลดไฟล์ไม่ได้ในมุมมองนี้'); return; }
  const targets = exportTargets(scope);
  if (!targets.length) { toast('ไม่มีตารางให้ส่งออก'); return; }
  S.exporting = true; render();
  try {
    let blob;
    if (format === 'xlsx') {
      await ensureExcel();
      const wb = new ExcelJS.Workbook(); const used = new Set();
      for (const t of targets) sheetToExcel(wb, buildForm(t), used);
      blob = new Blob([await wb.xlsx.writeBuffer()]);
    } else {

      if (!document.getElementById('pfcss')) { const st = document.createElement('style'); st.id = 'pfcss'; st.textContent = PF_CSS; document.head.appendChild(st); }
      const wrap = document.createElement('div'); wrap.className = 'pfwrap'; document.body.appendChild(wrap);
      try { await document.fonts.load('16px Sarabun'); await document.fonts.load('bold 16px Sarabun'); } catch(e) {}
      const pdf = new window.jspdf.jsPDF({orientation: 'landscape', unit: 'mm', format: 'a4', compress: true});

        toast(`กำลังสร้าง PDF ${i + 1}/${targets.length}`);

        wrap.querySelectorAll('.fit').forEach(sp => { const td = sp.parentElement; let fs = parseFloat(getComputedStyle(td).fontSize); while (sp.offsetWidth > td.clientWidth - 4 && fs > 7) { fs -= 0.5; td.style.fontSize = fs + 'px'; } });
        const canvas = await html2canvas(wrap.firstChild, {scale: 1.7, backgroundColor: '#ffffff', logging: false});
        const img = canvas.toDataURL('image/jpeg', 0.85);
        const mw = 297 - 14, mh = 210 - 14; const ratio = Math.min(mw / canvas.width, mh / canvas.height);
        const w = canvas.width * ratio, h = canvas.height * ratio;
        if (i) pdf.addPage('a4', 'landscape');
        pdf.addImage(img, 'JPEG', (297 - w) / 2, 7, w, h);
        await new Promise(r => setTimeout(r, 0));
      }
      wrap.remove();
      blob = pdf.output('blob');
    }
    await S.dl.save({filename: exportFileName(scope, format), data: blob});
    toast('ส่งไฟล์แล้ว');
  } catch (e) {
    if (e && e.code === 'declined') toast('ยกเลิกการดาวน์โหลด');
    else toast('สร้างไฟล์ไม่สำเร็จ: ' + (e && (e.code || e.message) || 'ไม่ทราบสาเหตุ'));
  } finally { S.exporting = false; S.modal = null; render(); }
}

const LP_DOC_RE = /(ใบมอบหมายงาน|ใบความรู้|ใบกิจกรรม|ใบงาน)[ \t]*(?:ที่[ \t]*)?0*(\d+)(?:[ \t]*\.[ \t]*0*(\d+))?(?![ \t]*\.[ \t]*[^\d.])(?![ \t]*ใบ(?!ความรู้|งาน|กิจกรรม|มอบหมายงาน))(?![\d.]*\d)/g;
// เลขเดี่ยว ("ใบงานที่ 4") อาจเป็นลำดับในหน่วย หรือ ลำดับต่อเนื่องทั้งเล่ม (AI/ครูบางครั้งนับต่อกันทุกหน่วย)
// ถ้าในหน่วยนั้นมีเลขเดี่ยวของชนิดนั้นเกินจำนวนเอกสารในหน่วย ถือว่าทั้งหน่วยใช้ลำดับต่อเนื่องทั้งเล่ม
function lpDocGlobal(p, kind){
  const out = []; (p && p.units || []).forEach((uu, ii) => { const ids = lpSheetIds(uu, ii); (uu.sheets || []).filter(x => x.kind === kind).forEach(sh => out.push(ids.get(sh))); });
  return out;
}
function lpDocMode(u, kind, p){
  const local = (u.sheets || []).filter(x => x.kind === kind).length; const re = new RegExp(LP_DOC_RE.source, 'g');
  const txt = [...Object.values(u.lesson || {}), ...(u.sheets || []).flatMap(sh => Object.values(sh.f || {}))].filter(v => typeof v === 'string').join('\n');
  let max = 0; for (const m of txt.matchAll(re)) if (LP_DOC_KIND[m[1]] === kind && m[3] == null) max = Math.max(max, +m[2]);
  return p && max > local && max <= lpDocGlobal(p, kind).length ? 'global' : 'local';
}
function lpDocRefs(s, u, i, miss, p){
  if (!s || typeof s !== 'string') return s;
  const ids = lpSheetIds(u, i); const mode = {};
  return s.replace(new RegExp(LP_DOC_RE.source, 'g'), (m, kt, a, b) => {
    if (b != null) return `${kt}ที่ ${+a}.${+b}`;
    const kind = LP_DOC_KIND[kt]; mode[kind] = mode[kind] || lpDocMode(u, kind, p);
    let id = null;
    if (mode[kind] === 'global') id = lpDocGlobal(p, kind)[+a - 1] || null;
    else { const sh = (u.sheets || []).filter(x => x.kind === kind)[+a - 1]; id = sh ? ids.get(sh) : null; }
    if (!id) { if (miss) miss.push(`${kt}ที่ ${a}`); return m; }
    return `${kt}ที่ ${id}`;
  });
}
const lpDocRefList = s => [...String(s || '').matchAll(new RegExp(LP_DOC_RE.source, 'g'))].filter(m => m[3] != null).map(m => ({kind: LP_DOC_KIND[m[1]], title: m[1], id: `${+m[2]}.${+m[3]}`}));

function lpParseJson(text){
  let t = String(text || '').trim();
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (fence) t = fence[1].trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}'); if (a >= 0 && b > a) t = t.slice(a, b + 1);
  try { return JSON.parse(t); } catch (_) {}
  let out = '', inStr = false, esc = false;
  for (const ch of t.replace(/[\u201C\u201D]/g, '"')) {
    if (inStr) {
      if (esc) { out += ch; esc = false; continue; }
      if (ch === '\\') { out += ch; esc = true; continue; }
      if (ch === '"') { inStr = false; out += ch; continue; }
      if (ch === '\n') { out += '\\n'; continue; } if (ch === '\r') continue; if (ch === '\t') { out += '\\t'; continue; }
      out += ch;
    } else { if (ch === '"') inStr = true; out += ch; }
  }
  out = out.replace(/,\s*([}\]])/g, '$1');
  try { return JSON.parse(out); } catch (_) { return null; }
}

- ชั่วโมงทฤษฎีรวมทุกหน่วยต้องเท่ากับ ${tg.t} และปฏิบัติรวมเท่ากับ ${tg.p} พอดี (ไม่รวมการประเมินผลลัพธ์ระดับรายวิชา ท ${+p.evalT || 0} ป ${+p.evalP || 0} ชั่วโมง)
- แต่ละหน่วยให้: ชื่อหน่วย, ชั่วโมง ท/ป, สัปดาห์ที่สอน, ชื่อเรื่อง/งาน, หัวข้อสาระการเรียนรู้ (ละเอียดเป็นหัวข้อย่อย), งานปฏิบัติ/ใบงาน, และน้ำหนักพฤติกรรม 0-5 (k ความรู้, u ความเข้าใจ, ap การนำไปใช้, an การวิเคราะห์, ev การประเมินค่า, cr การสร้างสรรค์, ps ทักษะพิสัย, af จิตพิสัย, apl ประยุกต์ใช้)
- ไม่ต้องเขียนเนื้อหาเต็ม ไม่ต้องใส่เอกสารอ้างอิง

ตอบเป็น JSON ในกล่องโค้ดเพียงกล่องเดียว ตามรูปแบบนี้ (ภาษาไทย):
{"job":"...","duties":[{"name":"งานหลัก","tasks":[{"name":"งานย่อย","comp":"","know":"ความรู้","skill":"ทักษะ"}]}],
 "units":[{"name":"ชื่อหน่วย","t":2,"p":4,"weeks":"1-2","topic":"ชื่อเรื่อง/งาน","content":["หัวข้อ 1","หัวข้อ 2"],"jobs":["ใบงานที่ ... ชื่องาน"],"b":{"k":1,"u":1,"ap":1,"an":0,"ev":0,"cr":0,"ps":2,"af":1,"apl":1}}]}`;
}
// แปลงคำตอบเป็นหน่วย: อ่าน JSON ก่อน ถ้าไม่ใช่ JSON และมี AI ในระบบ ให้ AI แปลงรูปแบบ (ห้ามเปลี่ยนเนื้อหา)
async function lpImportParse(text, mode){
  let r = lpParseJson(text);
  const ok = x => x && (mode === 'analysis' ? Array.isArray(x.duties) && x.duties.length : Array.isArray(x.units) && x.units.length);
  if (!ok(r) && S.sample) {
    const res = await S.sample(`แปลงข้อความการออกแบบหน่วยการเรียนรู้ด้านล่างเป็น JSON ตามรูปแบบที่กำหนด คัดลอกชื่อหน่วย ชั่วโมง และหัวข้อตามต้นฉบับทุกตัวอักษร ห้ามเพิ่ม ตัด หรือแต่งเนื้อหาใหม่ ถ้าต้นฉบับไม่มีข้อมูลใดให้เว้นว่างหรือ 0\nรูปแบบ: {"job":"","duties":[{"name":"","tasks":[{"name":"","comp":"","know":"","skill":""}]}],"units":[{"name":"","t":0,"p":0,"weeks":"","topic":"","content":[""],"jobs":[""],"b":{}}]}\n\nข้อความ:\n${text}\n\nตอบเป็น JSON object เดียว`, {modelTier: 'default'});
    r = lpParseJson(res && res.text);
  }
  if (!ok(r)) throw new Error(S.sample ? 'อ่านคำตอบไม่ได้ ให้ ChatGPT ตอบเป็น JSON ตามคำสั่งที่คัดลอกไป' : 'อ่านคำตอบไม่ได้ ต้องเป็น JSON ตามคำสั่งที่คัดลอกไป (ให้ ChatGPT “ตอบใหม่เป็น JSON ตามรูปแบบ”)');
  const L = v => Array.isArray(v) ? v.map(x => typeof x === 'object' ? Object.values(x).join(' ') : String(x)).filter(Boolean).join('\n') : String(v || '');
  const num = v => Math.max(0, Math.round(Number(String(v ?? '').replace(/[^\d.]/g, '')) || 0));
  const units = (r.units || []).map(x => ({name: lpUnitTitle(x.name || x.unit), t: num(x.t ?? x.theory), p: num(x.p ?? x.practice), weeks: String(x.weeks || x.week || '').trim(), topic: String(x.topic || '').trim(),
    content: L(x.content || x.topics), jobs: L(x.jobs || x.sheets || x.tasks), b: Object.fromEntries([...BLOOM, ...BEH_OTHER].map(([k]) => [k, num((x.b || {})[k])]).filter(([, v]) => v))}));
  const duties = Array.isArray(r.duties) ? r.duties.map(d => ({name: String(d.name || '').trim(), tasks: (Array.isArray(d.tasks) ? d.tasks : []).map(t => typeof t === 'string' ? {name: t, comp: '', know: '', skill: ''} : {name: String(t.name || ''), comp: '', know: L(t.know), skill: L(t.skill)})})).filter(d => d.name) : [];
  // งานย่อยเขียนเลขนำหน้ามา (เช่น 1.1) ให้ตัดออก ระบบใส่เลขให้เอง
  duties.forEach(d => { d.name = lpDutyTitle(d.name); d.tasks.forEach(t => { t.name = lpTaskTitle(t.name); }); });
  return {job: String(r.job || '').trim(), duties, units};
}
// ChatGPT บนเซิร์ฟเวอร์ Railway (ตั้ง OPENAI_API_KEY) — บน claude.ai ไม่มี
async function lpGptReady(){ try { return !!(window.ttServer && (await window.ttServer).gpt); } catch (_) { return false; } }
async function lpAskGpt(prompt){
  let r; try { r = await fetch('api/gpt', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({prompt})}); } catch (_) { throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(/quota|billing|insufficient/i.test(j.error || '') ? 'เครดิต OpenAI หมด เติมที่ platform.openai.com' : 'ChatGPT: ' + (j.error || 'HTTP ' + r.status));
  if (j.truncated) throw new Error('คำตอบของ ChatGPT ยาวเกินไป ลองขอจำนวนหน่วยน้อยลง');
  return j.text || '';
}
// สัปดาห์ที่สอน (สอนครั้งที่) คำนวณจากชั่วโมงสะสม เมื่อไม่ได้ระบุมา
function lpWeeks(p, units){
  const per = (+p.t || 0) + (+p.p || 0); if (!per) return units.map(u => u.weeks || '');
  let acc = 0; return units.map(u => { const a = Math.floor(acc / per) + 1; acc += (u.t || 0) + (u.p || 0); const b = Math.max(a, Math.ceil(acc / per)); return u.weeks || (a === b ? String(a) : a + '-' + b); });
}
function lpImportApply(d, withAnalysis, quiet, mode){
  const p = LP.draft; const old = p.units || [];
  if (mode === 'analysis') { if (d.job) p.job = d.job; p.duties = d.duties; lpSaveSoon(); S.modal = null; renderModal(); LP.sec = 'analysis'; render();
    toast(`นำเข้าตารางวิเคราะห์แล้ว (${d.duties.length} งานหลัก ${d.duties.reduce((a, x) => a + x.tasks.length, 0)} งานย่อย) ตรวจและแก้ไขได้ในหน้านี้`); return; }
  const wk = lpWeeks(p, d.units);
  p.units = d.units.map((x, i) => {
    const prev = old.find(o => (o.name || '').trim() === x.name); const u = prev ? JSON.parse(JSON.stringify(prev)) : blankUnit();
    u.name = x.name; u.t = x.t; u.p = x.p; if (Object.keys(x.b).length) u.b = x.b;
    u.lesson = u.lesson || {}; if (x.topic) u.lesson.topic = x.topic; u.lesson.session = wk[i] || u.lesson.session || '';
    u.design = [x.content && 'หัวข้อสาระการเรียนรู้:\n' + x.content, x.jobs && 'งานปฏิบัติ/ใบงาน:\n' + x.jobs].filter(Boolean).join('\n');
    u.designJobs = lines(x.jobs).map(j => j.replace(/^ใบ(งาน|กิจกรรม)(ที่)?\s*[\d.]*\s*[:：-]?\s*/, '').trim()).filter(Boolean).slice(0, 4);
    (u.sheets || []).forEach(sh => { if (!sh.session) sh.session = u.lesson.session; });
    return u;
  });
  if (withAnalysis) { if (d.job) p.job = d.job; if (d.duties.length) p.duties = d.duties; }
  lpSaveSoon(); if (quiet) return;
  S.modal = null; renderModal(); LP.sec = 'units'; render();
  toast(`นำเข้า ${p.units.length} หน่วยแล้ว ต่อไปกด “ให้ AI ร่างทั้งเล่ม” เพื่อร่างแผนและใบช่วยสอนตามหน่วยที่ออกแบบไว้`);
}

async function lpAllRun(gptOn){
  const o = S.lpAllOpt; const p = LP.draft; const planId = LP.id; if (!p || !S.sample) return;
  const filled = (obj, keys) => keys.some(k => obj && String(obj[k] || '').trim());
  const lessonKeys = LESSON_FIELDS.map(f => f[0]).filter(k => !/^r\d/.test(k));
  LP.allRun = {done: 0, total: 1, label: 'เตรียมงาน', stop: false}; render();
  const failed = [];
  const step = async (label, kind, ds) => {
    if (LP.allRun.stop || LP.id !== planId) throw {code: 'stopped'};
    LP.allRun.label = label; render();
    try { await lpAiStep(kind, ds || {}); }
    catch (e) { if (e && (e.code === 'not_granted' || e.code === 'rate_limited' || /credit|balance|api key|authentication/i.test(e.message || ''))) throw e; failed.push(label); }
    LP.allRun.done++; render();
  };
  const nU0 = (p.units || []).length || 8;
  const stdLinkOn = lpStdStatus(p) === 'FULL_STANDARD' && (o.analysis || o.units);
  LP.allRun.total = (stdLinkOn ? 1 : 0) + (o.preface ? 1 : 0) + (o.analysis ? 1 : 0) + (o.units ? 1 : 0) + (window.ttServer && o.refs ? 1 : 0) + (o.lessons ? nU0 : 0) + (o.sheets ? nU0 * 2 : 0);
  try {
    if (o.preface && !(o.skip && filled(p, ['preface']))) await step('คำนำ', 'lpAiPreface'); else if (o.preface) LP.allRun.done++;
    if (gptOn && o.gpt && !(p.units || []).some(u => String(u.design || '').trim())) { /* ChatGPT ทำตารางวิเคราะห์ให้ในขั้นถัดไป */ }
    else if (o.analysis && !(o.skip && (p.job || (p.duties || []).some(d => d.name)))) await step('ตารางวิเคราะห์หน่วยการเรียนรู้', 'lpAiAnalysis'); else if (o.analysis) LP.allRun.done++;
    let designed = (p.units || []).some(u => String(u.design || '').trim());
    if (gptOn && o.gpt && !designed) {
      // ChatGPT ออกแบบหน่วย + ตารางวิเคราะห์ (หยุดทั้งหมดถ้าไม่สำเร็จ เพราะขั้นต่อไปต้องใช้หน่วย)
      if (LP.allRun.stop || LP.id !== planId) throw {code: 'stopped'};
      LP.allRun.label = 'ChatGPT กำลังออกแบบหน่วยการเรียนรู้'; render();
      lpImportApply(await lpImportParse(await lpAskGpt(lpImportPrompt(p))), true, true);
      LP.allRun.done += (o.analysis ? 1 : 0) + (o.units ? 1 : 0); render(); designed = true;
    }
    if (o.units && !designed && !(o.skip && (p.units || []).some(u => u.name))) await step('หน่วยการเรียนรู้', 'lpAiUnits'); else if (o.units) LP.allRun.done++;
    // เชื่อมงานย่อย/หน่วยกับข้อในมาตรฐานฉบับเต็ม (เลือกเฉพาะเลขข้อที่มีจริง)
    if (stdLinkOn) { const linked = (p.duties || []).some(d => (d.tasks || []).some(t => Object.values(t.stdLinks || {}).some(Boolean)));
      if (o.skip && linked) LP.allRun.done++; else await step('เชื่อมงานย่อย/หน่วยกับมาตรฐานอาชีพ', 'lpAiStdLink'); }
    // บรรณานุกรมก่อนร่างใบช่วยสอน: ใบช่วยสอนจะอ้างอิงจากรายการนี้เท่านั้น
    if (window.ttServer && o.refs) { if (o.skip && (p.bibItems || []).length) LP.allRun.done++; else await step('ค้นเอกสารอ้างอิงจากเว็บ', 'lpAiRefs'); }
    const units = p.units || [];
    const jobsOf = u => Math.max(1, (u.designJobs || []).length);
    const pt0 = lpParts(p); const nSheets = u => (pt0.info ? 1 : 0) + (pt0.activity && (u.activitySheet || {}).required ? 1 : 0) + (pt0.assign && (u.assignmentSheet || {}).required ? 1 : 0) + (pt0.job ? jobsOf(u) : 0);
    LP.allRun.total = LP.allRun.done + (o.lessons ? units.length : 0) + (o.sheets ? units.reduce((a, u) => a + nSheets(u), 0) : 0);
    for (let i = 0; i < units.length; i++) {
      const u = units[i];
      if (o.lessons) { if (o.skip && filled(u.lesson, lessonKeys)) LP.allRun.done++; else await step(`แผนหน่วยที่ ${i + 1} ${u.name || ''}`, 'lpAiLesson', {i}); }
      // ใบความรู้ 1 ใบ + ใบงานตามจำนวนงานปฏิบัติในกรอบการออกแบบหน่วย (อย่างน้อย 1 ใบ)
      const pt = lpParts(p);
      // ใบกิจกรรม/ใบมอบหมายงาน: สร้างเฉพาะเมื่อแผนระบุกิจกรรม/งานมอบหมายที่ต่างจากใบงาน (activitySheet/assignmentSheet.required) หรือมีอยู่แล้ว
      const has = k => (u.sheets || []).some(x => x.kind === k);
      const plan = [...(pt.info ? [['info', 1, '']] : []), ...(pt.activity && ((u.activitySheet || {}).required || has('activity')) ? [['activity', 1, '']] : []), ...(pt.job ? Array.from({length: jobsOf(u)}, (_, k) => ['job', k + 1, (u.designJobs || [])[k] || '']) : []), ...(pt.assign && ((u.assignmentSheet || {}).required || has('assign')) ? [['assign', 1, '']] : [])];
      if (o.sheets) for (const [kind, n, topic] of plan.filter(([k]) => (u.docs || {})[k] !== false)) {
        u.sheets = u.sheets || [];
        let j = u.sheets.filter(x => x.kind === kind)[n - 1]; j = j ? u.sheets.indexOf(j) : -1;
        if (j < 0) { u.sheets.push({id: uid('h'), kind, no: (i + 1) + '.' + n, topic: topic || (u.lesson && u.lesson.topic) || u.name || '', session: (u.lesson && u.lesson.session) || '', f: {}}); j = u.sheets.length - 1; lpSaveSoon(); }
        if (o.skip && Object.values(u.sheets[j].f || {}).some(v => String(v || '').trim())) { LP.allRun.done++; continue; }
        await step(`${SHEET_KINDS[kind].title}ที่ ${u.sheets[j].no} หน่วยที่ ${i + 1}`, 'lpAiSheet', {i, j});
      }
    }
    toast(failed.length ? `ร่างเสร็จ แต่มี ${failed.length} ส่วนที่ไม่สำเร็จ (${failed.slice(0, 3).join(', ')}${failed.length > 3 ? ' …' : ''}) กด “ให้ AI ร่างทั้งเล่ม” อีกครั้งเพื่อลองเฉพาะส่วนที่ยังว่าง` : 'AI ร่างทั้งเล่มเสร็จแล้ว ตรวจและแก้ไขก่อนส่งออก');
  } catch (e) {
    toast(e && e.code === 'stopped' ? `หยุดแล้ว ร่างเสร็จ ${LP.allRun.done} ขั้นตอน` : aiErr(e) + ` (เสร็จ ${LP.allRun.done} ขั้นตอน)`);
  } finally { LP.allRun = null; await lpSaveNow(); render(); }
}

/* ================= อ้างอิงมาตรฐาน =================
   Data flow: หลักสูตรรายวิชา → ข้อความ "อ้างอิงมาตรฐาน" (ต้นฉบับ) → ประเภทมาตรฐาน → แหล่งที่มา → รายละเอียดมาตรฐาน → Duty/Task → หน่วย → แผน
   - ข้อความที่พิมพ์ในเอกสารใช้ข้อความต้นฉบับจากหลักสูตร (p.stdRefRaw) ไม่ให้ AI เปลี่ยนชื่อมาตรฐาน
   - รายละเอียดมาตรฐาน (ความรู้/ความสามารถ/หน่วยสมรรถนะ/เกณฑ์ ฯลฯ) มาจากเอกสารมาตรฐานที่ผู้ใช้นำเข้าเท่านั้น
   - ข้อ 2.1 ของแผน และช่องสมรรถนะย่อยในตารางวิเคราะห์ สร้างจากข้อมูลมาตรฐานเท่านั้น (ไม่รับข้อความที่ AI แต่ง) */
const LP_STD_TYPES = [
  ['NONE', 'ไม่มีการอ้างอิงมาตรฐาน'],
  ['NATIONAL_SKILL_STANDARD', 'มาตรฐานฝีมือแรงงานแห่งชาติ'],
  ['PROFESSIONAL_QUALIFICATION', 'มาตรฐานอาชีพและคุณวุฒิวิชาชีพ (สถาบันคุณวุฒิวิชาชีพ)'],
  ['OCCUPATIONAL_STANDARD', 'มาตรฐานอาชีพ (หน่วยงานอื่น)'],
  ['SKILL_UPGRADE_CURRICULUM', 'หลักสูตรฝึกยกระดับฝีมือแรงงาน/หลักสูตรฝึกอบรม'],
  ['OTHER', 'มาตรฐานอื่น ๆ']];
const LP_STD_STATUS = {NONE: 'ไม่ได้อ้างอิงมาตรฐาน', REFERENCE_ONLY: 'มีข้อมูลอ้างอิง แต่ยังไม่มีรายละเอียดมาตรฐาน', FULL_STANDARD: 'มีรายละเอียดมาตรฐานฉบับเต็ม'};
const LP_STD_KEYS = ['std', 'stdComp', 'criteria', 'method', 'pev', 'kev']; // ข้อ 2.1 ของแผนฯ — มาจากมาตรฐานเท่านั้น
const LP_STD_ORGS = ['กรมพัฒนาฝีมือแรงงาน', 'สถาบันคุณวุฒิวิชาชีพ (องค์การมหาชน)', 'สถาบันคุณวุฒิวิชาชีพ', 'สำนักงานคณะกรรมการการอาชีวศึกษา', 'สภาวิศวกร', 'สภาวิชาชีพ'];

// แยกข้อความอ้างอิงมาตรฐาน → ประเภท/หน่วยงาน/ชื่อมาตรฐาน/สาขาอาชีพ/ระดับ (เก็บเฉพาะที่พบในข้อความ ไม่เดา)
function lpStdParse(raw){
  const t = lpNorm(raw || '').replace(/\s+/g, ' ').trim();
  const out = {type: 'NONE', organization: '', standardName: '', occupation: '', level: ''};
  if (!t || /^(ไม่มี|-|—)$/.test(t)) return out;
  const types = [['NATIONAL_SKILL_STANDARD', /มาตรฐานฝีมือแรงงานแห่งชาติ/], ['SKILL_UPGRADE_CURRICULUM', /หลักสูตร(ฝึก)?ยกระดับฝีมือ|หลักสูตรฝึกอบรม/],
    ['PROFESSIONAL_QUALIFICATION', /(?:มาตรฐานอาชีพและ)?คุณวุฒิวิชาชีพ|TPQI/i], ['OCCUPATIONAL_STANDARD', /มาตรฐานอาชีพ/]];
  const hit = types.find(([, re]) => re.test(t));
  out.type = hit ? hit[0] : 'OTHER';

const lpObjs = L => lpLines(L.objs).map(lpClean).filter(Boolean).map((text, i) => ({text, dom: (L.objDom || [])[i] || ''}));

/* ================= บรรณานุกรม: collect → normalize → deduplicate → validate metadata → sort → format ================= */
const LP_BIB_FIELDS = [['author', 'ผู้แต่ง/หน่วยงาน'], ['year', 'ปีที่พิมพ์/เผยแพร่'], ['title', 'ชื่อเรื่อง'], ['edition', 'ครั้งที่พิมพ์'], ['place', 'สถานที่พิมพ์'], ['publisher', 'สำนักพิมพ์/ผู้ผลิต'], ['url', 'URL'], ['accessed', 'วันที่สืบค้น']];
const lpHash = s => { let h = 5381; for (const c of String(s)) h = ((h * 33) ^ c.codePointAt(0)) >>> 0; return 'b' + h.toString(36); };
// 1) collect: ทุกแหล่งในแผน พร้อมที่มา
function lpBibCollect(p){
  const raw = []; const parts = lpParts(p);

  { const st = lpStd(p), ss = lpStdStatus(p); if (ss === 'FULL_STANDARD' || (ss === 'REFERENCE_ONLY' && st.refPage)) { const t = lpStdSourceText(st); if (t) { const fields = {}; LP_BIB_FIELDS.forEach(([k]) => { fields[k] = ''; }); fields.title = t; fields.url = String(st.sourceUrl || '').trim(); raw.push({text: [t, fields.url].filter(Boolean).join(' '), where: 'หน้ามาตรฐานอาชีพ', fields}); } } }
  // รายการที่ AI ค้นจากเว็บ (มีหน้าเว็บยืนยันทุกรายการ) เก็บเป็นข้อมูลแยกช่อง

// 2) normalize
const lpBibNormText = t => lpNorm(t).replace(/^\s*(?:\[\d+\]|\d+(?:\.\d+)*\s*[.)]|[-•*–])\s*/, '').replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/\s+/g, ' ').replace(/\s+([.,:;])/g, '$1').trim();
// แยกส่วนจากข้อความอิสระ (ไม่เดา: ส่วนที่หาไม่พบปล่อยว่าง)
function lpBibParse(text){
  const f = {author: '', year: '', title: '', edition: '', place: '', publisher: '', url: '', accessed: ''};
  let t = text;
  const url = t.match(/https?:\/\/[^\s,)]+/i); if (url) { f.url = url[0].replace(/[.]+$/, ''); t = t.replace(url[0], ' '); }
  const acc = t.match(/(?:สืบค้น(?:เมื่อ)?(?:วันที่)?|เข้าถึง(?:เมื่อ)?|Retrieved(?: on)?|Accessed(?: on)?)\s*:?\s*([^,;()]*?\d{4})/i); if (acc) { f.accessed = acc[1].trim(); t = t.replace(acc[0], ' '); }

// ประเภทแหล่ง (หนังสือเรียน / เอกสารประกอบการสอน / คู่มือ / สื่อ) เป็นส่วนหนึ่งของคีย์ — ต่างประเภทไม่รวมกัน

  .replace(/\d{5}-\d{4}|รายวิชา|วิชา|ระดับ|ฉบับปรับปรุง|ฉบับ|ปวช\.?|ปวส\.?|สำหรับ|เรื่อง/g, '')

// 3) deduplicate + 4) validate + 5) sort  (คืนรายการพร้อมสถานะ ให้ UI และตัวส่งออกใช้ชุดเดียวกัน)

    if (!g.texts.includes(r.text)) g.texts.push(r.text);
    if (!g.from.includes(r.where)) g.from.push(r.where);

    const edited = LP_BIB_FIELDS.some(([k]) => e[k] != null && String(e[k]).trim() !== '');

    return {id, fields, kind: lpBibKind(fields), texts: g.texts, from: g.from, sources: g.sources, merged: g.texts.length, missing, edited, exclude: !!e.exclude, status, text: lpBibFormat(fields, g.texts[0], edited || !missing.length || (fields.title && ['author', 'year', 'publisher', 'url'].some(k => fields[k])))};
  });

  const isThai = r => /^[฀-๿]/.test(r.fields.author || r.fields.publisher || r.fields.title);
  const sortKey = r => (r.fields.author || r.fields.publisher || r.fields.title).replace(/^(นาย|นางสาว|นาง|ดร\.|ผศ\.|รศ\.|ศ\.)\s*/, '');

// 6) format (แบบ APA ภาษาไทย) — ถ้าข้อมูลไม่ครบและผู้ใช้ยังไม่แก้ พิมพ์ข้อความเดิมตามที่กรอก (ไม่เติมเอง)
function lpBibFormat(f, original, structured){
  if (!structured) return original;
  const end = s => s && !/[.?!]$/.test(s) ? s + '.' : s;

/* ---- ตรวจความครบถ้วน/สอดคล้องก่อน export (ไม่แก้ข้อมูลเอง แจ้งเตือนเท่านั้น) ---- */

  if (sj && (Number(sj.t) !== Number(p.t) || Number(sj.p) !== Number(p.p) || Number(sj.c) !== Number(p.c))) warns.push(`ท-ป-นก ในแผน (${p.t}-${p.p}-${p.c}) ไม่ตรงกับรหัสวิชาในระบบ (${sj.t}-${sj.p}-${sj.c})`);

  const ids = new Set(lpStdElements(st).map(e => e.id)); let dangling = 0;
  units.forEach((u, i) => { const on = Object.keys(u.stdLinks || {}).filter(k => u.stdLinks[k]); dangling += on.filter(k => !ids.has(k)).length;
    if (sst === 'FULL_STANDARD' && u.mappingType !== 'COURSE_DESCRIPTION_ONLY' && !on.some(k => ids.has(k))) warns.push(`หน่วยที่ ${i + 1}: ยังไม่ได้เชื่อมกับข้อในมาตรฐาน (ข้อ 2.1 จะพิมพ์ว่าไม่อ้างอิงโดยตรงกับข้อในมาตรฐาน)`); });

  const legacy = lpStdLegacy(p);

    (u.sheets || []).filter(sh => (sh.kind === 'activity' || sh.kind === 'assign') && pt2[sh.kind] !== false).forEach(sh => {

}

/* ================= โมเดลเอกสาร =================

function lpBuildModel(p){
  const st = settings(); const parts = lpParts(p);
  // ตรา: ตามแบบฟอร์มใช้ตรา สอศ.; เลือกใช้ตราสถานศึกษาได้ (ตั้งค่าในหน้าปก)
  const logo = p.logoMode === 'college' && st.logo ? st.logo : p.logoMode === 'none' ? '' : LP_OVEC_LOGO;
  const S_ = lpStd(p), stdStatus = lpStdStatus(p), stdEls = lpStdElements(S_);
  const sections = []; let sec = null; const toc = []; let bmN = 0;
  const bmNew = () => '_Toc_lp' + (++bmN);
  const section = (kind, orient = 'portrait') => { sec = {orient, kind, blocks: []}; sections.push(sec); };
  // หน้าใหม่: ถ้าแนวกระดาษเปลี่ยนเท่านั้นจึงเปิด section ใหม่ ไม่เช่นนั้นใช้ page break
  const page = (orient = 'portrait') => { if (sec.orient !== orient) section('body', orient); else if (sec.blocks.length) sec.blocks.push({t: 'pb'}); };
  const add = b => sec.blocks.push(b);
  const P = (text, o = {}) => add({t: 'p', text: String(text ?? ''), ...o});
  const H = (level, text, o = {}) => { const bm = o.bm || bmNew(); if (o.toc !== false) toc.push({level, text: o.tocText || text, bm, front: !!o.front}); add({t: 'h', level, text, ...o, bm}); return bm; };
  const dot = s => s ? String(s) : '..........................';
  // ข้อย่อยเดียวไม่ต้องมีเลข
  const items = (list, prefix, indent = 1) => { const a = lpLines(list).map(lpClean).filter(Boolean); a.forEach((x, i) => P(a.length === 1 ? x : prefix ? `${prefix}${i + 1} ${x}` : `${i + 1}. ${x}`, {indent, num: true, just: true})); }; // ระดับบนสุดมีจุดหลังเลข (1. 2.)
  const text = (s, indent = 1) => lpLines(s).forEach(x => P(x, {indent, just: true}));
  // รายการแบบมีเลขข้อตามลำดับชั้น (แบบฟอร์ม: 5.1, 5.2, 5.2.1 …): บรรทัดที่มีเลขเดิมใช้เลขนั้นต่อท้าย prefix,
  // บรรทัดที่ไม่มีเลข: ถ้าทั้งรายการไม่มีเลขเลย ให้เลขเรียงทุกบรรทัด ไม่เช่นนั้นเป็นย่อหน้าใต้ข้อก่อนหน้า, บรรทัด "-" เป็นข้อย่อยไม่มีเลข
  // รายการระดับลึก (เช่นใต้ 2.1.1): หลายบรรทัดใช้เครื่องหมาย - แบ่งข้อ บรรทัดเดียวไม่ต้องมีเครื่องหมาย
  const bullets = (s, indent) => { const a = lpLines(s).map(x => x.replace(/^\s*(?:[-•*–]|\d+(?:\.\d+)*[.)]?)\s+/, '')); a.forEach(x => P(a.length > 1 ? '- ' + x : x, {indent, just: true})); };
  const NUM_RE = /^\s*(?:ข้อ\s*)?(\d+(?:\.\d+)*)[.)]?\s+(?=\S)/;
  const hierList = (s, prefix, indent = 1) => { const L0 = lpLines(s); if (!L0.length) return false;
    if (L0.length === 1) { P(L0[0].replace(NUM_RE, '').replace(/^\s*[-•*–]\s*/, ''), {indent, just: true}); return true; } // ข้อเดียวไม่ต้องมีเลข
    const anyNum = L0.some(x => NUM_RE.test(x)); let n = 0, depth = indent;
    L0.forEach(x => { const m = x.match(NUM_RE);
      if (m) { const no = m[1]; depth = indent + no.split('.').length - 1; P(`${prefix}${no} ${x.slice(m[0].length).trim()}`, {indent: depth, num: true, just: true}); }
      else if (/^\s*[-•*–]\s*/.test(x)) P('- ' + x.replace(/^\s*[-•*–]\s*/, ''), {indent: depth + 1, just: true});
      else if (!anyNum) { n++; P(`${prefix}${n} ${x}`, {indent, num: true, just: true}); }
      else P(x, {indent: depth + 1, just: true}); });
    return true; };
  const label = (t, indent, o = {}) => P(t, {indent, keepNext: true, ...o});
  const secHead = t => P(t, {style: 'SecHead'});
  // บรรทัดกรอกข้อมูลเต็มบรรทัด: ป้ายกำกับ + เส้นจุดถึงช่องถัดไป (ใช้แท็บมีจุดนำ) — parts = [[ป้าย, สัดส่วนความกว้าง], ...]
  const fillLine = (parts, o = {}) => { let acc = 0; const tot = parts.reduce((a, x) => a + x[1], 0); const tabs = [];
    parts.forEach(([, w], k) => { acc += w; tabs.push({frac: acc / tot, last: k === parts.length - 1}); });
    P(parts.map(([l], k) => (k ? ' ' : '') + l + '\t').join(''), {tabs, ...o}); };
  // ช่องลงชื่อ: ตารางไม่มีเส้น ชิดขวา — "ลงชื่อ ……… ตำแหน่ง" และ "(ชื่อเต็ม)" อยู่กึ่งกลางใต้เส้นลงชื่อ
  const signBlock = (role, name, o = {}) => { const rows = [[{text: ''}, {text: 'ลงชื่อ', align: 'right'}, {text: '', leader: true}, {text: role}],
      [{text: ''}, {text: ''}, name ? C(`(${name})`) : {text: '(\t)', leader: 'paren'}, {text: ''}]];
    if (o.date) rows.push([{text: ''}, {text: 'วันที่', align: 'right'}, {text: '', leader: true}, {text: ''}]);
    if (o.before) P('', {after: 0, before: o.before});
    add({t: 'table', noBorder: true, widths: [38, 11, 37, 14], rows, keepRows: true}); };
  const dots = (n, indent) => { for (let k = 0; k < n; k++) P('\t', {indent, leader: true}); }; // เส้นจุดด้วย tab leader
  const elText = e => S_.type === 'NATIONAL_SKILL_STANDARD' ? `${e.group} ${e.no} ${e.label}` : `${e.no ? e.no + ' ' : ''}${e.label}${e.group && !e.no ? ` (${e.group})` : ''}`;
  const elRefs = els => S_.type === 'NATIONAL_SKILL_STANDARD' ? [...new Set(els.map(e => e.group))].map(g => `${g} ${els.filter(e => e.group === g).map(e => e.no).join(', ')}`).join('\n') : els.map(elText).join('\n');
  const uName = (u, i) => `หน่วยที่ ${i + 1} เรื่อง/งาน ${lpUnitTitle(u.name)}`.trim();
  const EVAL_TITLE = 'แบบประเมินความสามารถในการปฏิบัติงาน/ผลลัพธ์การเรียนรู้/สมรรถนะ';
  const C = (t, o = {}) => ({text: String(t), align: 'center', ...o});

  /* หน้าปก — ตำแหน่ง/ขนาดวัดจากแบบฟอร์ม (pt จากขอบบน): ตรา 90 (123×123) · ชื่อเล่ม 28pt @214 · หลักสูตร/สาขา/ประเภท 20pt @258 ·
     รหัสวิชา 22pt @380 · วิทยาลัย 22pt @683 · เส้น + สำนักงานฯ 24pt @763 */
  section('cover');
  const cv = (t, size, top, o = {}) => P(t, {cover: {size, top}, size: o.style ? undefined : size, align: 'center', ...o});
  add({t: 'img', data: logo, w: 164, h: 164, cover: {top: 90, h: 123}});
  cv('แผนการจัดการเรียนรู้', 28, 214, {style: 'Title'});
  // แบบฟอร์ม 2567 ฉบับใหม่: ตรา → ชื่อเล่ม → หลักสูตร → สาขาวิชา → กลุ่มอาชีพ → ประเภทวิชา → รหัสวิชา/วิชา → วิทยาลัย (ไม่มีส่วน โดย/ตำแหน่ง/แผนกวิชา)
  const pre = (lbl, v) => lbl + dot(String(v || '').replace(new RegExp('^' + lbl + '\\s*'), ''));
  cv(p.curriculum, 20, 258); cv(pre('สาขาวิชา', p.field), 20, 281); cv('กลุ่มอาชีพ ' + dot(String(p.occ || '').replace(/^กลุ่มอาชีพ\s*/, '')), 20, 304); cv(pre('ประเภทวิชา', p.vtype), 20, 327);
  cv(`รหัสวิชา ${dot(p.code)}  วิชา ${dot(p.name)}`, 22, 380, {b: true});
  cv(pre('วิทยาลัย', p.college), 22, 683, {b: true});
  cv('สำนักงานคณะกรรมการการอาชีวศึกษา\tกระทรวงศึกษาธิการ', 24, 763, {align: 'left', color: '0070C0', borderTop: true, tabAt: 5748});

  /* คำนำ / สารบัญ (เลขหน้า ก ข) */
  section('front');
  H(1, 'คำนำ', {front: true, bm: '_Toc_lpF1'}); // เลขหน้าส่วนหน้า (ก ข) — bookmark ขึ้นต้น lpF
  lpLines(p.preface).forEach(x => P(x, {first: true, just: true}));
  P(dot(p.author), {align: 'right', before: 24});
  page();
  H(1, 'สารบัญ', {front: true, bm: '_Toc_lpF2'}); // เลขหน้าส่วนหน้า (ก ข) — bookmark ขึ้นต้น lpF
  P('หน้า', {align: 'right', b: true});
  add({t: 'toc'});

  /* เนื้อหา (เลขหน้าเริ่ม 1) */
  section('body');
  H(1, 'หลักสูตรรายวิชา');
  const curr = String(p.curriculum || '').replace(/^หลักสูตร\s*/, '');
  P(`หลักสูตร ${dot(curr)}`, {align: 'center'});
  P(`ประเภทวิชา ${dot(String(p.vtype || '').replace(/^ประเภทวิชา/, ''))}  กลุ่มอาชีพ ${dot(p.occ)}  สาขาวิชา ${dot(p.field)}`, {align: 'center'});
  P(`รหัส ${dot(p.code)}  ชื่อวิชา ${dot(p.name)}`, {align: 'center'});
  P(`ทฤษฎี ${p.t} ชั่วโมง/สัปดาห์  ปฏิบัติ ${p.p} ชั่วโมง/สัปดาห์  จำนวน ${p.c} หน่วยกิต`, {align: 'center', after: 12});
  // อ้างอิงมาตรฐาน: พิมพ์ข้อความต้นฉบับจากหลักสูตรรายวิชา (ห้ามแก้ชื่อมาตรฐาน)
  if (stdStatus !== 'NONE') { secHead('อ้างอิงมาตรฐาน'); lpLines(lpStdRefText(S_)).forEach(x => P(x, {indent: 1, keepNext: true})); P('', {after: 0}); }
  // ผลลัพธ์การเรียนรู้ระดับรายวิชา (Job) — คัดลอกจากหลักสูตรรายวิชา อยู่ระหว่างอ้างอิงมาตรฐานกับจุดประสงค์รายวิชา
  secHead('ผลลัพธ์การเรียนรู้ระดับรายวิชา'); lpLines(p.job).forEach(x => P(x, {indent: 1, just: true})); if (!lpLines(p.job).length) P(dot(''), {indent: 1});
  secHead('จุดประสงค์รายวิชา เพื่อให้'); items(p.objectives, '');
  secHead('สมรรถนะรายวิชา'); items(p.competencies, '');
  secHead('คำอธิบายรายวิชา'); lpLines(p.description).forEach(x => P(x, {first: true, just: true}));

  /* หน้ามาตรฐาน: เลือกรูปแบบตามประเภทมาตรฐาน (FULL_STANDARD หรือผู้ใช้เลือกแสดงเฉพาะข้อมูลอ้างอิง) */
  if (stdStatus === 'FULL_STANDARD' || (stdStatus === 'REFERENCE_ONLY' && S_.refPage)) {
    page();
    H(1, 'มาตรฐานอาชีพ', {tocText: 'มาตรฐานอาชีพ (ถ้ามี)'});
    const row = (l, v) => { if (v) { P(l, {b: true, align: 'center', keepNext: true}); P(v, {align: 'center', after: 6}); } };
    if (S_.type === 'NATIONAL_SKILL_STANDARD') {
      // แบบฟอร์ม: หน่วยงานรับรองมาตรฐานอาชีพ … / มาตรฐานฝีมือแรงงานแห่งชาติ สาขาอาชีพ … ระดับ … / ตาราง เนื้อหา | หมายเหตุ (คัดลอกจากต้นฉบับ)
      if (S_.organization) P(`หน่วยงานรับรองมาตรฐานอาชีพ ${S_.organization}`, {align: 'center', b: true, keepNext: true});
      P([S_.standardName || 'มาตรฐานฝีมือแรงงานแห่งชาติ', S_.occupation && 'สาขาอาชีพ' + S_.occupation.replace(/^สาขาอาชีพ\s*/, ''), S_.level && 'ระดับ ' + S_.level].filter(Boolean).join(' '), {align: 'center', b: true, after: 8, keepNext: true});
      if (stdStatus === 'FULL_STANDARD') {
        const NB = '    '; const TH = 'กขคงจฉชซฌญฎฏฐฑฒณดตถทธนบปผฝพฟภมยรลวศษสหฬอฮ';
        const intro = (S_.detail || {}).intro || {};
        const sRows = [[C('เนื้อหา', {b: true, fill: LPD.fills.head}), C('หมายเหตุ', {b: true, fill: LPD.fills.head})]];
        // หัวหมวด: "1. ความรู้" + ข้อความหัวข้อจากต้นฉบับ · ข้อย่อย (1) → 1.1.1 และ (ก) → 1.1.1.1 (ถ้อยคำคงเดิม)
        [['1. ความรู้', 'ความรู้', 'knowledge'], ['2. ความสามารถ', 'ความสามารถ', 'ability'], ['3. ทัศนคติ', 'ทัศนคติ', 'attitude']].forEach(([l, g, k]) => { const es = stdEls.filter(e => e.group === g); if (!es.length) return;
          const it = String(intro[k] || '').trim();
          if (es.length === 1 && !es[0].subs.length) { // หมวดที่มีข้อเดียว (เช่น ทัศนคติ): แสดงในแถวหัวหมวด ไม่ต้องมีเลขข้อ
            sRows.push([{text: l + ' ' + (it && it.replace(/\s/g, '').includes(es[0].label.replace(/\s/g, '').slice(0, 15)) ? it : es[0].label), cs: 2, bp: l.length}]); return; }
          sRows.push([{text: it ? l + ' ' + it : l, cs: 2, bp: l.length}]);
          es.forEach(e => { let n1 = '';
            const lines = [`${NB}${e.no} ${e.label}`, ...e.subs.map(x => { const m = x.match(/^\((\d+|[ก-ฮ])\)\s*(.*)$/); if (!m) return NB + NB + x;
              if (/\d/.test(m[1])) { n1 = m[1]; return `${NB}${NB}${e.no}.${m[1]} ${m[2]}`; }
              return `${NB}${NB}${NB}${e.no}.${n1 || 1}.${TH.indexOf(m[1]) + 1} ${m[2]}`; })];
            sRows.push([{text: lines.join('\n'), valign: 'top'}, {text: ''}]); }); });
        add({t: 'table', widths: [82, 18], rows: sRows, head: 1, keepRows: true});
      }
    } else if (S_.type === 'PROFESSIONAL_QUALIFICATION' || S_.type === 'OCCUPATIONAL_STANDARD') {
      row('หน่วยงานรับรองมาตรฐานอาชีพ', S_.organization);
      P(lpStdHeadline(S_), {b: true, align: 'center', after: 8});
      if (stdStatus === 'FULL_STANDARD') add({t: 'table', widths: [24, 28, 30, 18], head: 1, keepRows: true, rows: [
        ['หน่วยสมรรถนะ', 'สมรรถนะย่อย', 'เกณฑ์การปฏิบัติงาน', 'วิธีประเมิน'].map(x => C(x, {b: true, fill: LPD.fills.head})),
        ...(S_.detail.units || []).filter(u => lpLines(u.elements).length).map(u => [{text: [u.code, u.name].filter(Boolean).join(' '), valign: 'top'}, {text: lpLines(u.elements).join('\n'), valign: 'top'}, {text: lpLines(u.criteria).join('\n') || '-', valign: 'top'}, {text: lpLines(u.method).join('\n') || '-', valign: 'top'}])]});
    } else {
      row('หน่วยงาน', S_.organization);
      P(lpStdHeadline(S_), {b: true, align: 'center', after: 8});
      if (stdStatus === 'FULL_STANDARD') text(S_.detail.items, 0);
    }
    if (stdStatus === 'REFERENCE_ONLY') P('(หลักสูตรรายวิชาระบุการอ้างอิงมาตรฐานนี้ โดยไม่มีรายละเอียดรายข้อประกอบ)', {align: 'center', before: 12});
    { const src = lpStdSourceText(S_); if (src) P(`ที่มา: ${src}`, {before: 10, just: true}); if (S_.sourceUrl) P(`ลิงก์มาตรฐานอาชีพ: ${S_.sourceUrl}`, {link: S_.sourceUrl}); }
  }

  /* ตารางวิเคราะห์หน่วยการเรียนรู้: ข้อความยาว → หน้าแนวนอน (section ใหม่) แล้วกลับแนวตั้ง */
  const tasks = (p.duties || []).flatMap(d => d.tasks || []);
  const avgLen = tasks.length ? tasks.reduce((a, t) => a + String(t.know || '').length + String(t.skill || '').length + String(t.comp || '').length, 0) / tasks.length : 0;
  const landscape = avgLen > 70;
  page(landscape ? 'landscape' : 'portrait');
  H(1, 'ตารางวิเคราะห์หน่วยการเรียนรู้');
  const aRows = [[{text: 'ผลลัพธ์การเรียนรู้ระดับรายวิชา (Job) ' + (p.job || ''), cs: 5, b: true, fill: LPD.fills.head, align: 'center'}],
    ['งานหลัก\n(Duty)', 'งานย่อย\n(Task)', 'สมรรถนะย่อย\n(มาตรฐานอาชีพ)', 'ความรู้\nในการปฏิบัติงาน', 'ทักษะ\nในการปฏิบัติงาน'].map(x => ({text: x, b: true, align: 'center'}))];
  (p.duties || []).forEach((d, i) => (d.tasks && d.tasks.length ? d.tasks : [{}]).forEach((t, j, arr) => {
    const row = []; if (j === 0) row.push({text: `${i + 1}. ${lpDutyTitle(d.name)}`.trim(), rs: arr.length, b: true, valign: 'top'});
    row.push({text: `${i + 1}.${j + 1} ${lpTaskTitle(t.name)}`.trim(), valign: 'top'}, {text: stdStatus === 'FULL_STANDARD' ? (elRefs(lpStdLinked(S_, t.stdLinks)) || '-') : '', valign: 'top'}, {text: t.know || '', valign: 'top'}, {text: t.skill || '', valign: 'top'});
    aRows.push(row);
  }));
  add({t: 'table', widths: landscape ? [15, 21, 14, 25, 25] : [17, 22, 15, 23, 23], rows: aRows, head: 2, keepRows: true});
  // (ไม่มีหมายเหตุใต้ตาราง ตามที่ผู้ใช้กำหนด)

  /* ตารางวิเคราะห์พฤติกรรมการเรียนรู้ — ใช้เครื่องหมาย ✓ ระบุพฤติกรรมที่คาดหวังของแต่ละหน่วย (ไม่รวมคะแนน) */
  let ST = 0, SP = 0; (p.units || []).forEach(u => { ST += Number(u.t || 0); SP += Number(u.p || 0); });
  const eT = Number(p.evalT || 0), eP = Number(p.evalP || 0);
  page();
  H(1, 'ตารางวิเคราะห์พฤติกรรมการเรียนรู้');
  P(`รหัส ${dot(p.code)}  ชื่อวิชา ${dot(p.name)}`, {align: 'center'});
  P(`ทฤษฎี ${p.t} ชั่วโมง/สัปดาห์  ปฏิบัติ ${p.p} ชั่วโมง/สัปดาห์  จำนวน ${p.c} หน่วยกิต`, {align: 'center', after: 8});
  const bRows = [[C('หน่วยการเรียนรู้', {rs: 3, b: true, fill: LPD.fills.head}), C('ความสามารถที่คาดหวัง', {cs: 9, b: true, fill: LPD.fills.head}), C('จำนวนชั่วโมง\nท/ป', {rs: 3, b: true, fill: 'FCE4D6'})],
    [C('พุทธิพิสัย', {cs: 6, b: true, fill: LPD.fills.head}), C('ทักษะพิสัย', {rs: 2, b: true, fill: 'EBF1DE', vert: true}), C('จิตพิสัย', {rs: 2, b: true, fill: 'EBF1DE', vert: true}), C('ประยุกต์ใช้', {rs: 2, b: true, fill: 'EBF1DE', vert: true})],

function lpBreakThai(s){
  if (!LP_SEG || !LP_TH.test(s)) return s;
  const segs = [...LP_SEG.segment(s)].map(x => x.segment);
  // ตำแหน่งที่อยู่ภายในคำในรายการ → ห้ามตัด
  const inside = new Set();
  for (const w of LP_NOBREAK) { let i = s.indexOf(w); while (i >= 0) { for (let k = i + 1; k < i + w.length; k++) inside.add(k); i = s.indexOf(w, i + 1); } }

  for (const seg of segs) {
    if (prev && LP_TH.test(prev.slice(-1)) && LP_TH.test(seg[0]) && !/[ะ-ฺๅ-๎]/.test(seg[0])) {
      // ส่วนสั้น 1–2 ตัว (เศษพยางค์ เช่น ได คา ซิ ไบ) ต่อกับส่วนถัดไปเสมอ

      out += glue ? '\u2060' : '\u200B';
    }
    out += seg; pos += seg.length; prev = seg;
  }
  return out;
}

    else if (s.kind === 'body') props.page.pageNumbers = {formatType: D.NumberFormat.DECIMAL};
    const out = {properties: props, children, _kind: s.kind};
    // หัวกระดาษ: กำหนดเฉพาะหน้าปก (ว่าง) และส่วนแรกที่มีเลขหน้า — section ถัดไป "Link to Previous"

    else if (s.kind === 'front') out.headers = {default: pageNumHeader()};
    sections.push(out);
  });
